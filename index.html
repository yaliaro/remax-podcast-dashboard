<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE/MAX × WeDo — דשבורד פודקאסטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --d-fast:250ms; --d-quick:150ms; --ease:cubic-bezier(.22,1,.36,1);
  --bg:#0b0e15; --card:#151a25; --card2:#1b2230; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.16);
  --tx:#f1f3f8; --mut:#9aa2b2; --mut2:#6b7488;
  --reach:#36d6c6; --deep:#f3a23e;
  --ig:#ec5e9c; --fb:#4d8df5; --yt:#ff6a5a; --sp:#39d077; --ap:#a87bf0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";font-size:15px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
/* header */
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:18px 0 14px}
.brand{font-weight:900;font-size:18px}.brand .s{color:var(--mut2);font-weight:300;margin:0 6px}
.brand .r{color:var(--reach)}
.hmeta{font-size:12px;color:var(--mut)}
/* sticky tabs */
.tabwrap{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);padding:6px 0 12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 15px;border:none;background:none;color:var(--mut);font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background var(--d-quick),color var(--d-quick)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.tab:hover:not([aria-selected="true"]){color:var(--tx)}
/* panels */
.panel{display:none}.panel.on{display:block;animation:fade var(--d-fast) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* kpi row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:14px}
.kpi .l{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:4px}
.kpi .v.reach{color:var(--reach)}.kpi .v.deep{color:var(--deep)}
.kpi .s{font-size:11.5px;color:var(--mut2);margin-top:2px}
/* section card */
.block{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.block>h3{font-size:15px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.block>.sub{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
/* segmented */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:3px;margin-bottom:14px}
.seg button{border:none;background:none;color:var(--mut);font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:7px;cursor:pointer;transition:all var(--d-quick)}
.seg button.on{background:var(--card2);color:var(--tx)}
/* leaderboard table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;color:var(--mut);font-weight:600;text-align:right;padding:0 10px 9px;white-space:nowrap}
th.c-reach{color:var(--reach)}th.c-deep{color:var(--deep)}
td{padding:9px 10px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap}
.cell{position:relative}
.cellbar{position:absolute;inset:0;border-radius:6px;opacity:.16;z-index:0}
.cellv{position:relative;z-index:1;font-weight:600}
.rank{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--bd);border-radius:6px;font-size:11px;color:var(--mut);margin-left:8px}
tr.r1 .rank{background:rgba(54,214,198,.15);color:var(--reach);border-color:transparent}
/* split bar (one row = full reach split) */
.splitrow{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.splitrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:26px;background:var(--bg);border-radius:7px;display:flex;overflow:hidden}
.sbar .sg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#08111a;min-width:0;transition:width var(--d-fast) var(--ease)}
.splitrow .tt{text-align:left;font-weight:800}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
/* trend */
.trendgrid{display:flex;gap:14px;align-items:stretch}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--mut2);text-align:left;padding:2px 0}
.trendsvg{flex:1;height:120px}
.trendsvg .ln{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke}
.trendsvg .ar{stroke:none;opacity:.12}
.trendsvg .dotp{fill:var(--reach)}
.xax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut2);margin-top:6px;padding:0 4px}
/* insights */
.insgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ins{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:13px;border-inline-start:3px solid var(--reach)}
.ins.flag{border-inline-start-color:var(--deep)}
.ins .t{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.ins .b{font-size:17px;font-weight:800;margin:4px 0 3px}
.ins .x{font-size:12.5px;color:var(--mut);line-height:1.4}
/* per-show mini grid */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 13px}
.mc .l{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.mc .n{font-size:20px;font-weight:800;margin-top:3px}
/* show 2-col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.demo .dl{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;font-size:13px;color:var(--mut);padding:3px 0}
.demo .db{height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.demo .db>span{display:block;height:100%;background:linear-gradient(90deg,var(--fb),var(--reach));border-radius:5px}
.demo .dl .num{color:var(--tx);font-weight:600;text-align:left}
.eptbl td{font-size:13px;padding:8px 10px}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;margin-bottom:7px;transition:border-color var(--d-quick)}
.post:hover{border-color:var(--bd2)}
.post .pl{font-size:13px;font-weight:500}.post .pmeta{font-size:11.5px;color:var(--mut);margin-top:2px}
.post .pv{font-size:17px;font-weight:800;white-space:nowrap}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color var(--d-quick)}
.btn:hover{border-color:var(--bd2)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1d2433;border:1px solid var(--bd2);padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:all var(--d-fast) var(--ease);z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}.mgrid{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}.insgrid{grid-template-columns:1fr}
  .splitrow{grid-template-columns:92px 1fr 56px;gap:8px}
  table{font-size:13px}td,th{padding-left:6px;padding-right:6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">wedo<span class="s">|</span><span class="r">RE/MAX</span></div>
    <div class="hmeta"><span id="org"></span> · <span id="range"></span></div>
  </header>
  <div class="tabwrap"><div class="tabs" id="tabs"></div></div>
  <div id="panels"></div>
  <div class="foot"><span id="sources"></span><span>wedo | RE/MAX</span></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const D=window.DASHBOARD_DATA, nf=n=>(n==null?'–':n.toLocaleString('en-US'));
const $=id=>document.getElementById(id), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const COL={ig:'#ec5e9c',fb:'#4d8df5',yt:'#ff6a5a',sp:'#39d077',ap:'#a87bf0',reach:'#36d6c6',deep:'#f3a23e'};
const o=D.overview, shows=D.shows;
$('org').textContent='אורגני · אפס ממומן';
$('range').textContent=D.meta.range;
$('sources').textContent=D.meta.sources.join(' · ');

// reach/deep helpers per show
const R=s=>s.instagram_views+s.facebook_views;
const L=s=>s.youtube_views+s.spotify_streams+s.apple_plays;

/* ---------- TABS ---------- */
const tabsEl=$('tabs'), panelsEl=$('panels');
const tabDefs=[{id:'all',name:'סקירת הכל'}].concat(shows.map((s,i)=>({id:'s'+i,name:s.name})));
tabDefs.forEach((t,i)=>{
  const b=el('button','tab',t.name);b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=()=>sel(i);
  tabsEl.appendChild(b);
  const p=el('div','panel'+(i===0?' on':''));p.id='p'+i;
  p.innerHTML=i===0?overviewHTML():showHTML(shows[i-1]);
  panelsEl.appendChild(p);
});
function sel(i){[...tabsEl.children].forEach((t,j)=>t.setAttribute('aria-selected',i===j?'true':'false'));
  [...panelsEl.children].forEach((p,j)=>p.classList.toggle('on',i===j));
  window.scrollTo({top:0,behavior:'smooth'});
  if(i===0)drawTrend('trend-all',aggTrend);else drawTrend('trend-'+(i-1),(shows[i-1].trend||[]).map(p=>p.v||0));}

/* ---------- OVERVIEW ---------- */
function overviewHTML(){
  const totR=shows.reduce((a,s)=>a+R(s),0), totL=shows.reduce((a,s)=>a+L(s),0);
  return `
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="l"><span class="dot" style="background:${COL.reach}"></span>חשיפה · צפיות רילס</div><div class="v reach num">${nf(totR)}</div><div class="s">Instagram + Facebook</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:${COL.deep}"></span>האזנה · פרקים מלאים</div><div class="v deep num">${nf(totL)}</div><div class="s">YouTube + Spotify + Apple</div></div>
    <div class="kpi"><div class="l">מספר תוכניות</div><div class="v num">${shows.length}</div><div class="s">המבוגר · אוויר פסגות · הפיצוח · סוגרים</div></div>
  </div>

  <div class="block">
    <h3>מבט-על · כל התוכניות</h3>
    <div class="sub">חשיפה (רילס) והאזנה (פרקים) — שני מדדים נפרדים. ריל קצר ≠ האזנה לפרק מלא.</div>
    <div class="seg" id="seg-sort">
      <button class="on" data-k="reach">מיין לפי חשיפה</button>
      <button data-k="deep">מיין לפי האזנה</button>
    </div>
    <div style="overflow-x:auto"><table id="lead"></table></div>
  </div>

  <div class="block">
    <h3>חלוקת החשיפה בין התוכניות</h3>
    <div class="sub">כמה צפיות לכל תוכנית, מפוצל IG/FB — והאחוז מהסך</div>
    <div id="split"></div>
    <div class="legend"><span><span class="dot" style="background:${COL.ig}"></span> Instagram</span><span><span class="dot" style="background:${COL.fb}"></span> Facebook</span></div>
  </div>

  <div class="block">
    <h3>מגמת חשיפה · 30 יום אחרונים</h3>
    <div class="sub">סך הזרמות יומיות, כל 4 התוכניות (Spotify)</div>
    <div class="trendgrid"><div class="yax" id="yax-all"></div><svg class="trendsvg" id="trend-all" viewBox="0 0 600 120" preserveAspectRatio="none"></svg></div>
    <div class="xax" id="xax-all"></div>
  </div>

  <div class="two">
    <div class="block"><h3>מאיפה מאזינים · כל התוכניות</h3><div class="sub">Spotify · סך מאזינים לפי מדינה</div><div class="demo" id="geo-all"></div></div>
    <div class="block"><h3>גיל הקהל · כל התוכניות</h3><div class="sub">Spotify · סך מאזינים לפי טווח גיל</div><div class="demo" id="age-all"></div></div>
  </div>

  <div class="toolbar">
    <button class="btn" onclick="copyT()"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>העתק טבלה</button>
    <button class="btn" onclick="csvT()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>CSV</button>
  </div>`;
}
function renderLead(sortKey){
  const max={ig:Math.max(...shows.map(s=>s.instagram_views)),fb:Math.max(...shows.map(s=>s.facebook_views)),
    yt:Math.max(...shows.map(s=>s.youtube_views)),sp:Math.max(...shows.map(s=>s.spotify_streams)),ap:Math.max(...shows.map(s=>s.apple_plays))};
  const sorted=[...shows].sort((a,b)=>(sortKey==='deep'?L(b)-L(a):R(b)-R(a)));
  const cell=(v,m,c)=>`<td class="cell"><span class="cellbar" style="background:${c};width:${m?Math.round(100*v/m):0}%"></span><span class="cellv num">${nf(v)}</span></td>`;
  let h=`<thead><tr><th>תוכנית</th><th class="c-reach">Instagram</th><th class="c-reach">Facebook</th><th class="c-deep">YouTube</th><th class="c-deep">Spotify</th><th class="c-deep">Apple</th><th>שימור</th></tr></thead><tbody>`;
  sorted.forEach((s,i)=>{h+=`<tr class="${i===0?'r1':''}"><td class="nm">${s.name}<span class="rank">${i+1}</span></td>`+
    cell(s.instagram_views,max.ig,COL.ig)+cell(s.facebook_views,max.fb,COL.fb)+
    cell(s.youtube_views,max.yt,COL.yt)+cell(s.spotify_streams,max.sp,COL.sp)+cell(s.apple_plays,max.ap,COL.ap)+
    `<td class="num">${s.youtube_retention_pct??'–'}%</td></tr>`;});
  $('lead').innerHTML=h+'</tbody>';
}
function renderSplit(){
  const tot=shows.reduce((a,s)=>a+R(s),0)||1, max=Math.max(...shows.map(R))||1;
  $('split').innerHTML=[...shows].sort((a,b)=>R(b)-R(a)).map(s=>{
    const r=R(s),pc=Math.round(100*r/tot),wIg=r?100*s.instagram_views/r:0,wFb=r?100*s.facebook_views/r:0,barW=Math.round(100*r/max);
    return `<div class="splitrow"><span class="nm">${s.name}</span>
      <div class="sbar" style="width:${Math.max(barW,8)}%"><span class="sg" style="width:${wIg}%;background:${COL.ig}">${s.instagram_views?nf(s.instagram_views):''}</span><span class="sg" style="width:${wFb}%;background:${COL.fb}">${s.facebook_views?nf(s.facebook_views):''}</span></div>
      <span class="tt num">${pc}%</span></div>`;}).join('');
}
/* trend draw with axes + numbers */
const aggMap={};shows.forEach(s=>(s.trend||[]).forEach(p=>{aggMap[p.d]=(aggMap[p.d]||0)+(p.v||0)}));
const aggKeys=Object.keys(aggMap).sort(), aggTrend=aggKeys.map(k=>aggMap[k]);
function drawTrend(svgId,series){
  const svg=$(svgId);if(!svg)return;const W=600,H=120,n=series.length;
  if(!n){svg.innerHTML='<text x="300" y="60" fill="#6b7488" font-size="13" text-anchor="middle">אין נתוני מגמה</text>';return;}
  const max=Math.max(...series,1),pts=series.map((v,i)=>[n>1?i*(W/(n-1)):0,H-8-(v/max)*(H-20)]);
  const ln=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const ar=`M0 ${H} `+ln.replace('M','L')+` L${W} ${H} Z`;
  // last point dot
  const lp=pts[pts.length-1];
  svg.innerHTML=`<path class="ar" d="${ar}" fill="${COL.reach}"/><path class="ln" d="${ln}" stroke="${COL.reach}"/><circle class="dotp" cx="${lp[0]}" cy="${lp[1]}" r="3.5"/>`;
  const yax=$( svgId.replace('trend','yax')); if(yax)yax.innerHTML=`<span>${nf(max)}</span><span>${nf(Math.round(max/2))}</span><span>0</span>`;
  const xax=$(svgId.replace('trend','xax')); if(xax&&svgId==='trend-all'){const f=aggKeys[0],l=aggKeys[aggKeys.length-1];xax.innerHTML=`<span>${f?f.slice(5):''}</span><span>${l?l.slice(5):''}</span>`;}
}
function renderDemoAll(){
  const geo={},age={};
  shows.forEach(s=>{(s.spotify_geo||[]).forEach(g=>{geo[g.displayName]=(geo[g.displayName]||0)+(g.value||0)});
    (s.spotify_age||[]).forEach(a=>{const n=(a.genderBreakdown?.counts||[]).reduce((x,c)=>x+(c.count||0),0);age[a.ageBracket]=(age[a.ageBracket]||0)+n});});
  const gE=Object.entries(geo).sort((a,b)=>b[1]-a[1]).slice(0,5),gSum=gE.reduce((a,e)=>a+e[1],0)||1,gMax=gE.length?gE[0][1]:1;
  $('geo-all').innerHTML=gE.map(([k,v])=>`<div class="dl"><span>${k}</span><div class="db"><span style="width:${Math.round(100*v/gMax)}%"></span></div><span class="num">${Math.round(100*v/gSum)}%</span></div>`).join('')||'<div class="sub">אין נתונים</div>';
  const order=['18-22','23-27','28-34','35-44','45-59','60-150'];
  const aE=Object.entries(age).filter(e=>e[1]>0).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])),aMax=Math.max(1,...aE.map(e=>e[1]));
  $('age-all').innerHTML=aE.map(([k,v])=>`<div class="dl"><span>${k}</span><div class="db"><span style="width:${Math.round(100*v/aMax)}%"></span></div><span class="num">${v}</span></div>`).join('')||'<div class="sub">אין נתונים</div>';
}

/* ---------- PER-SHOW ---------- */
function showHTML(s){
  const idx=shows.indexOf(s);
  const geo=(s.spotify_geo||[]).slice(0,4).map(g=>`<div class="dl"><span>${g.displayName}</span><div class="db"><span style="width:${Math.round(g.value*100)}%"></span></div><span class="num">${Math.round(g.value*100)}%</span></div>`).join('')||'<div class="sub">אין נתוני גאו</div>';
  const ages=(s.spotify_age||[]).map(a=>({br:a.ageBracket,n:(a.genderBreakdown?.counts||[]).reduce((x,c)=>x+(c.count||0),0)})).filter(a=>a.n>0);
  const mA=Math.max(1,...ages.map(a=>a.n));
  const ageH=ages.map(a=>`<div class="dl"><span>${a.br}</span><div class="db"><span style="width:${Math.round(100*a.n/mA)}%"></span></div><span class="num">${a.n}</span></div>`).join('')||'<div class="sub">מדגם קטן מדי</div>';
  const eps=(s.episodes||[]).map((e,i)=>`<tr><td><span class="rank">${i+1}</span> ${e.title.replace(/^פרק \\d+ - /,'').slice(0,46)}</td><td class="num" style="text-align:left;font-weight:700">${nf(e.plays)}</td></tr>`).join('')||'<tr><td colspan="2" class="sub">אין נתוני פרקים</td></tr>';
  const social=(s.social_posts||[]).slice(0,5).map(p=>{
    const inner=`<div><div class="pl">${p.label}</div><div class="pmeta">${p.platform} · ❤ ${nf(p.likes)} · 💬 ${nf(p.comments)} · ↗ ${nf(p.shares)}</div></div><div class="pv num" style="color:${p.platform==='Instagram'?COL.ig:COL.fb}">${nf(p.views)}</div>`;
    return p.url?`<a class="post" href="${p.url}" target="_blank">${inner}</a>`:`<div class="post">${inner}</div>`;}).join('')||'<div class="sub">אין רילס שזוהו</div>';
  return `
  <div class="mgrid">
    <div class="mc"><div class="l"><span class="dot" style="background:${COL.ig}"></span>Instagram</div><div class="n num">${nf(s.instagram_views)}</div></div>
    <div class="mc"><div class="l"><span class="dot" style="background:${COL.fb}"></span>Facebook</div><div class="n num">${nf(s.facebook_views)}</div></div>
    <div class="mc"><div class="l"><span class="dot" style="background:${COL.yt}"></span>YouTube</div><div class="n num">${nf(s.youtube_views)}</div></div>
    <div class="mc"><div class="l"><span class="dot" style="background:${COL.sp}"></span>Spotify</div><div class="n num">${nf(s.spotify_streams)}</div></div>
    <div class="mc"><div class="l"><span class="dot" style="background:${COL.ap}"></span>Apple</div><div class="n num">${nf(s.apple_plays)}</div></div>
  </div>
  <div class="block">
    <h3>${s.name} · מבט מהיר</h3>
    <div class="sub">חשיפה ${nf(R(s))} צפיות (רילס) · האזנה ${nf(L(s))} (פרקים) · שימור ביוטיוב ${s.youtube_retention_pct??'–'}%</div>
    <div class="trendgrid"><div class="yax" id="yax-${idx}"></div><svg class="trendsvg" id="trend-${idx}" viewBox="0 0 600 120" preserveAspectRatio="none"></svg></div>
    <div class="sub" style="margin:6px 0 0">מגמת הזרמות יומית · 30 יום (Spotify)</div>
  </div>
  <div class="two">
    <div class="block"><h3>ביצועים לפי פרק</h3><div class="sub">Spotify · מספר הזרמות לפרק</div><table class="eptbl"><tbody>${eps}</tbody></table></div>
    <div class="block"><h3>הסושיאל של התוכנית</h3><div class="sub">הרילים הפודקאסטיים שלה · לפי צפיות</div>${social}</div>
  </div>
  <div class="two">
    <div class="block"><h3>מאיפה מאזינים</h3><div class="sub">Spotify · מדגם קטן, מגמה</div><div class="demo">${geo}</div></div>
    <div class="block"><h3>גיל הקהל</h3><div class="sub">Spotify · מספר מאזינים לפי טווח גיל</div><div class="demo">${ageH}</div></div>
  </div>`;
}

/* ---------- copy/export ---------- */
function tRows(){let r=[['תוכנית','Instagram','Facebook','YouTube','Spotify','Apple','שימור%']];
  shows.forEach(s=>r.push([s.name,s.instagram_views,s.facebook_views,s.youtube_views,s.spotify_streams,s.apple_plays,s.youtube_retention_pct]));return r;}
function copyT(){navigator.clipboard.writeText(tRows().map(r=>r.join('\t')).join('\n')).then(()=>toast('הטבלה הועתקה'));}
function csvT(){const c='﻿'+tRows().map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='remax_podcasts.csv';a.click();}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- init ---------- */
renderLead('reach');renderSplit();renderDemoAll();drawTrend('trend-all',aggTrend);
$('seg-sort').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));renderLead(b.dataset.k);});
</script>
</body>
