<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE/MAX × WeDo — דשבורד פודקאסטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --d-fast:250ms; --d-quick:150ms; --ease:cubic-bezier(.22,1,.36,1);
  --bg:#0b0e15; --card:#151a25; --card2:#1b2230; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.17);
  --tx:#f1f3f8; --mut:#9aa2b2; --mut2:#6b7488;
  --reach:#36d6c6; --deep:#f3a23e; --good:#46c98a; --warn:#e0b34d;
  --ig:#ec5e9c; --fb:#4d8df5; --yt:#ff6a5a; --sp:#39d077; --ap:#a87bf0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";font-size:15px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 70px}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
a{color:inherit}
.vsw{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 0 4px}
.vsw a{font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:none;padding:6px 13px;border:1px solid var(--bd);border-radius:20px;transition:all var(--d-fast)}
.vsw a.on{background:var(--card2);color:var(--tx);border-color:var(--bd2)}
.vsw .edit{margin-inline-start:auto;cursor:pointer}
.vsw .edit.on{background:rgba(243,162,62,.16);color:var(--deep);border-color:rgba(243,162,62,.4)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0 10px}
.brand{font-weight:900;font-size:18px}.brand .s{color:var(--mut2);font-weight:300;margin:0 6px}.brand .r{color:var(--reach)}
.hmeta{font-size:12px;color:var(--mut);text-align:left}
.tabwrap{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 72%,transparent);padding:6px 0 12px}
.tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border:none;background:none;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background var(--d-fast),color var(--d-fast)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.tab.star[aria-selected="true"]{color:var(--deep);box-shadow:inset 0 0 0 1px rgba(243,162,62,.4)}
.panel{display:none}.panel.on{display:block;animation:fade var(--d-fast) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* KPI strip */
.strip{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1 1 0;min-width:150px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 15px;position:relative}
.kpi.lead{border-inline-start:3px solid var(--deep)}
.kpi .l{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:3px}
.kpi .v.reach{color:var(--reach)}.kpi .v.deep{color:var(--deep)}
.kpi .s{font-size:11px;color:var(--mut2);margin-top:1px}
/* blocks */
.block{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 17px;margin-bottom:14px;position:relative}
.block.reach{border-top:3px solid var(--reach)}.block.deep{border-top:3px solid var(--deep)}
.block.star{border-top:3px solid var(--deep)}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.bh h3{font-size:15.5px;font-weight:800}
.btag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.btag.r{background:rgba(54,214,198,.14);color:var(--reach)}.btag.d{background:rgba(243,162,62,.14);color:var(--deep)}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.explain{font-size:12px;color:var(--mut2);line-height:1.5;margin-top:3px}
.explain b{color:var(--mut);font-weight:600}
/* ref badge for editing */
.refbadge{display:none;position:absolute;top:-8px;inset-inline-start:12px;background:var(--deep);color:#1a1206;font-size:11px;font-weight:800;padding:1px 8px;border-radius:7px;letter-spacing:.3px;z-index:5}
body.editmode .refbadge{display:inline-block}
body.editmode .block{outline:1px dashed rgba(243,162,62,.35)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:0 9px 9px;white-space:nowrap}
td{padding:9px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap}
.cell{position:relative}.cellbar{position:absolute;inset:0;border-radius:6px;opacity:.15;z-index:0}.cellv{position:relative;z-index:1;font-weight:600}
td.tot{font-weight:800;color:var(--deep)}
.tag-sm{font-size:10px;color:var(--mut2);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin-inline-start:6px}
.scroll{overflow-x:auto;scrollbar-width:thin}
/* funnel */
.fnl{display:flex;flex-direction:column;gap:7px}
.fstep{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center}
.fstep .fl{font-size:13px;font-weight:600}
.fstep .fbarwrap{height:30px;background:var(--bg);border-radius:7px;overflow:hidden;position:relative}
.fstep .fbar{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-inline-end:9px;font-size:13px;font-weight:800;color:#08110d;transition:width var(--d-fast) var(--ease)}
.fstep .fnote{font-size:11.5px;color:var(--mut2);white-space:nowrap}
/* retention curve */
.curve{position:relative;height:140px;margin:8px 0 2px}
.curve svg{width:100%;height:100%;overflow:visible}
.gl{stroke:rgba(255,255,255,.06);stroke-width:1}.glt{fill:var(--mut2);font-size:9.5px}
.xlab{fill:var(--mut2);font-size:9.5px}
.spark{height:46px}.spark svg{width:100%;height:100%;overflow:visible}
/* mini-cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.mc{background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:11px 12px}
.mc .l{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.mc .n{font-size:18px;font-weight:800;margin-top:2px}.mc .x{font-size:10.5px;color:var(--mut2);margin-top:1px}
/* social by page */
.pg{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.pg:first-child{border-top:none}
.pg .nm{font-weight:600}.pg .nm a{text-decoration:none;border-bottom:1px dotted var(--mut2)}
.pg .meta{font-size:11px;color:var(--mut2);margin-top:1px}
.pg .vv{font-size:16px;font-weight:800;text-align:left;white-space:nowrap}
.pg .bar{grid-column:1/-1;height:6px;background:var(--bg);border-radius:5px;overflow:hidden}
.pg .bar>span{display:block;height:100%;border-radius:5px}
/* demo bars */
.demo .dl{display:grid;grid-template-columns:70px 1fr 42px;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);padding:3px 0}
.demo .db{height:8px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}
.demo .db>span{display:block;height:100%}
.demo .dl .num{color:var(--tx);font-weight:600;text-align:left}
.glegend{display:flex;gap:12px;font-size:11px;color:var(--mut2);margin-bottom:7px}
.glegend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* benchmark bars */
.bbar{display:grid;grid-template-columns:1fr;gap:9px}
.bbrow{display:grid;grid-template-columns:200px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bbrow .bl{color:var(--mut);font-weight:500}
.bbrow .bl b{color:var(--tx);font-weight:700}
.bbrow .bw{height:22px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.bbrow .bf{height:100%;border-radius:6px;transition:width var(--d-fast) var(--ease)}
.bbrow .bv{font-weight:800;white-space:nowrap}
.thresh{position:relative;border-top:1px dashed rgba(224,179,77,.5);margin:4px 0;font-size:11px;color:var(--warn);padding-top:3px}
.story{list-style:none;display:flex;flex-direction:column;gap:11px}
.story li{padding-inline-start:26px;position:relative;font-size:13.5px;line-height:1.55;color:#d6dae4}
.story li:before{content:"";position:absolute;inset-inline-start:6px;top:8px;width:7px;height:7px;border-radius:3px;background:var(--deep)}
.story li b{color:#fff}
.proj{background:rgba(243,162,62,.07);border:1px solid rgba(243,162,62,.22);border-radius:12px;padding:13px 15px;margin-top:4px}
.proj .pt{font-size:11px;font-weight:800;color:var(--deep);letter-spacing:.4px;margin-bottom:5px}
.note{font-size:11.5px;color:var(--mut2);font-style:italic;margin-top:7px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-size:12.5px;flex:1 1 150px}
.chip .cn{font-size:17px;font-weight:800;color:var(--reach)}.chip .cl{color:var(--mut);font-size:11.5px;margin-top:1px}
/* explorer */
.exctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.exsel{display:inline-flex;flex-direction:column;gap:3px}
.exsel label{font-size:10.5px;color:var(--mut2);font-weight:600}
.exsel select{background:var(--card2);border:1px solid var(--bd2);color:var(--tx);font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:9px;cursor:pointer}
.excards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.excard{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:15px}
.excard h4{font-size:14px;font-weight:800;margin-bottom:2px}
.excard .exsub{font-size:11.5px;color:var(--mut2);margin-bottom:11px}
.exbig{font-size:30px;font-weight:900;letter-spacing:-1px}
.exdrill{margin-top:12px;border-top:1px solid var(--bd);padding-top:11px}
.exrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;cursor:default}
.exrow .ev{font-weight:700;color:var(--tx)}
.exrow.clickable{cursor:pointer;border-radius:7px;padding:5px 8px;margin:0 -8px;transition:background var(--d-quick)}
.exrow.clickable:hover{background:rgba(255,255,255,.04)}
.exrow .caret{color:var(--mut2);font-size:11px}
.exdd{display:none;font-size:12px;color:var(--mut);padding:6px 8px 2px;line-height:1.6}
.exdd.open{display:block;animation:fade var(--d-quick) var(--ease)}
/* toolbar */
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--bd);font-size:11px;color:var(--mut2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1d2433;border:1px solid var(--bd2);padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:all var(--d-fast) var(--ease);z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){
  .strip{gap:7px}.kpi{min-width:calc(50% - 4px);padding:11px 13px}.kpi .v{font-size:21px}
  .two{grid-template-columns:1fr}.excards{grid-template-columns:1fr}
  .bbrow{grid-template-columns:1fr;gap:3px}.bbrow .bl{font-size:12px}
  .fstep{grid-template-columns:70px 1fr;gap:7px}.fstep .fnote{grid-column:2;text-align:left}
  table{font-size:12.5px}td,th{padding-inline:5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="vsw">
    <a class="on" href="index.html">דשבורד</a>
    <a href="explorer.html">וריאנט · חקירה</a>
    <a class="edit" id="editToggle">✎ מצב עריכה</a>
  </div>
  <header>
    <div class="brand">wedo<span class="s">|</span><span class="r">RE/MAX</span></div>
    <div class="hmeta"><span id="org"></span><br><span id="range"></span></div>
  </header>
  <div class="tabwrap"><div class="tabs" id="tabs"></div></div>
  <div id="panels"></div>
  <div class="foot"><span id="sources"></span><span>wedo | RE/MAX · אורגני</span></div>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const D=window.DASHBOARD_DATA;
const nf=n=>(n==null?'–':Math.round(n).toLocaleString('en-US'));
const $=id=>document.getElementById(id),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const COL={ig:'#ec5e9c',fb:'#4d8df5',yt:'#ff6a5a',sp:'#39d077',ap:'#a87bf0',reach:'#36d6c6',deep:'#f3a23e',male:'#4d8df5',female:'#ec5e9c',nb:'#a87bf0'};
const o=D.overview,shows=D.shows,social=D.social,B=D.benchmark;
const deepOf=s=>s.deep_total;
$('org').textContent=D.meta.organic_note;$('range').textContent=D.meta.range;$('sources').textContent='מקורות: '+D.meta.sources.join(' · ');

// ---- tabs ----
const TABS=[{k:'ov',name:'סקירה'},{k:'bm',name:'מול השוק',star:1}]
  .concat(shows.map((s,i)=>({k:'s'+i,name:s.name})))
  .concat([{k:'ex',name:'חקירה'}]);
const tabsEl=$('tabs'),panelsEl=$('panels');
TABS.forEach((t,i)=>{
  const b=el('button','tab'+(t.star?' star':''),t.name);
  b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=()=>sel(i);tabsEl.appendChild(b);
  const p=el('div','panel'+(i===0?' on':''));p.id='pan'+i;panelsEl.appendChild(p);
});
function build(i){const t=TABS[i],p=$('pan'+i);if(p.dataset.built)return;
  if(t.k==='ov')p.innerHTML=overviewHTML();
  else if(t.k==='bm')p.innerHTML=benchmarkHTML();
  else if(t.k==='ex')p.innerHTML=explorerHTML();
  else p.innerHTML=showHTML(shows[+t.k.slice(1)],+t.k.slice(1));
  p.dataset.built='1';afterBuild(t,i);}
function sel(i){[...tabsEl.children].forEach((t,j)=>t.setAttribute('aria-selected',i===j?'true':'false'));
  build(i);[...panelsEl.children].forEach((p,j)=>p.classList.toggle('on',i===j));window.scrollTo({top:0,behavior:'smooth'});}
function afterBuild(t,i){
  if(t.k==='ov'){renderLead();renderPages();drawSpark();renderApps('ov');}
  if(t.k==='bm'){drawBench();}
  if(t.k.startsWith('s')){const idx=+t.k.slice(1);drawCurves(idx);}
  if(t.k==='ex'){initExplorer();}
}
const RB=r=>`<span class="refbadge">${r}</span>`; // ref badge

/* =================== OVERVIEW =================== */
function overviewHTML(){
  const totDeep=o.deep_listens, pos=B.portfolio;
  const above=B.benchmark?.synthesis;
  return `
  <div class="strip">
    <div class="kpi lead">${RB('A1')}<div class="l"><span class="dot"></span>האזנה לפרקים</div><div class="v deep num">${nf(totDeep)}</div><div class="s">פרקים מלאים · YouTube + Spotify + Apple</div></div>
    <div class="kpi">${RB('A2')}<div class="l">חשיפה בסושיאל</div><div class="v reach num">${nf(social.total_views)}</div><div class="s">צפיות רילס · ${social.page_count} עמודים</div></div>
    <div class="kpi">${RB('A3')}<div class="l">מיקום מול השוק</div><div class="v num">×2</div><div class="s">2 מ-4 מעל חציון הפודקאסטים בעולם</div></div>
  </div>

  <div class="block deep">${RB('B1')}
    <div class="bh"><span class="btag d">האזנה</span><h3>האזנה לפרקים · לפי תוכנית</h3></div>
    <div class="sub">פרק מלא שנצרך בפועל. כאן הקרדיט שייך לתוכנית עצמה. מסודר לפי סך ההאזנה בכל הפלטפורמות.</div>
    <div class="scroll"><table id="lead"></table></div>
    <div class="explain"><b>שימור YouTube</b> = איזה אחוז מהסרטון נצפה בממוצע · <b>צופים ייחודיים</b> = אנשים שונים, לא צפיות חוזרות.</div>
  </div>

  <div class="block">${RB('C1')}
    <div class="bh"><h3>משפך ההמרה · ספוטיפיי</h3></div>
    <div class="sub">המסע מחשיפה להאזנה — כמה אנשים ספוטיפיי הציג להם את התוכנית, וכמה מהם הפכו למאזינים בפועל.</div>
    <div id="funnels"></div>
  </div>

  <div class="block">${RB('C2')}
    <div class="bh"><h3>מאיפה מגיעה החשיפה · ספוטיפיי</h3></div>
    <div class="sub">איך אנשים נתקלים בתוכנית בתוך ספוטיפיי. <b>הרבה יותר מהאזנות</b> — החשיפה רחבה, ההמרה היא הצעד הבא.</div>
    <div id="impr"></div>
  </div>

  <div class="block reach">${RB('D1')}
    <div class="bh"><span class="btag r">חשיפה</span><h3>חשיפה בסושיאל · לפי עמוד</h3></div>
    <div class="explain" style="margin-bottom:10px">החשיפה שייכת ל<b>עמוד שבו עלה הפוסט</b>, לא לתוכנית — רוב הנפח מגיע מעמודי-המותג (מאני, רימקס), לא מעמודי המגישים. לכן זה מדד נפרד מהאזנה, ואי-אפשר לסכם ביניהם.</div>
    <div id="pages"></div>
  </div>

  <div class="block">${RB('E1')}
    <div class="bh"><h3>מגמת האזנות יומית · ספוטיפיי</h3></div>
    <div class="sub">סך ההזרמות היומיות בכל 4 התוכניות, 30 הימים האחרונים.</div>
    <div class="spark"><svg id="sp-ov" viewBox="0 0 640 46" preserveAspectRatio="none"></svg></div>
  </div>

  <div class="toolbar">
    <button class="btn" onclick="copyT()"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>העתק טבלה</button>
    <button class="btn" onclick="csvT()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>CSV</button>
  </div>`;
}
function renderLead(){
  const mx={yt:Math.max(...shows.map(s=>s.platforms.youtube)),sp:Math.max(...shows.map(s=>s.platforms.spotify)),ap:Math.max(...shows.map(s=>s.platforms.apple)),d:Math.max(...shows.map(deepOf))};
  const c=(v,m,col)=>`<td class="cell"><span class="cellbar" style="background:${col};width:${m?Math.round(100*v/m):0}%"></span><span class="cellv num">${nf(v)}</span></td>`;
  let h=`<thead><tr><th>תוכנית</th><th>סך האזנה</th><th>YouTube</th><th>Spotify</th><th>Apple</th><th>צופים ייחודיים</th><th>שעות צפייה</th><th>שימור YT</th></tr></thead><tbody>`;
  shows.forEach(s=>{h+=`<tr><td class="nm">${s.name}</td>`+
    `<td class="tot num">${nf(deepOf(s))}</td>`+

function drawSparkInto(id,series,keys){
  const svg=$(id);if(!svg)return;const W=640,H=svg.id.startsWith('sp')?46:140;
  const n=series.length,max=Math.max(...series,1);
  if(!n){svg.innerHTML='';return;}
  const X=i=>4+(n>1?i*(W-8)/(n-1):0),Y=v=>4+(1-v/max)*(H-8);
  const pts=series.map((v,i)=>[X(i),Y(v)]);
  const ln=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const ar=`M${X(0)} ${H-4} `+ln.slice(1)+` L${X(n-1)} ${H-4} Z`;
  const mxi=series.indexOf(max),mp=pts[mxi];
  svg.innerHTML=`<path d="${ar}" fill="${COL.reach}" opacity=".1"/><path d="${ln}" fill="none" stroke="${COL.reach}" stroke-width="2"/>`+
    `<circle cx="${mp[0]}" cy="${mp[1]}" r="2.6" fill="${COL.reach}"/>`;
}

function demoAges(s){

function drawCurves(idx){

  let paths='',leg='';

      const X=pl+(x/100)*(W-pl-6),Y=pt+(1-yv/100)*(H-pt-pb);return [X,Y];});
    paths+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" opacity=".9"/>`;

  });

  svg.innerHTML=g+paths+xl;
  $('cvleg-'+idx).innerHTML=leg;
}
