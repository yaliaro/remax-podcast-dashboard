<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE/MAX × WeDo — דשבורד פודקאסטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --d-fast:250ms; --d-quick:150ms; --ease:cubic-bezier(.22,1,.36,1);
  --bg:#0b0e15; --card:#151a25; --card2:#1b2230; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.17);
  --tx:#f1f3f8; --mut:#9aa2b2; --mut2:#6b7488;
  --reach:#36d6c6; --deep:#f3a23e; --good:#46c98a; --warn:#e0b34d;
  --ig:#ec5e9c; --fb:#4d8df5; --yt:#ff6a5a; --sp:#39d077; --ap:#a87bf0;
  --male:#4d8df5; --female:#ec5e9c; --nb:#a87bf0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";font-size:15px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 70px}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
a{color:inherit}
.vsw{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 0 4px}
.vsw a{font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:none;padding:6px 13px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;transition:all var(--d-fast)}
.vsw a:hover{color:var(--tx);border-color:var(--bd2)}
.vsw .edit.on{background:rgba(243,162,62,.16);color:var(--deep);border-color:rgba(243,162,62,.4)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0 10px}
.brand{font-weight:900;font-size:18px}.brand .s{color:var(--mut2);font-weight:300;margin:0 6px}.brand .r{color:var(--reach)}
.hmeta{font-size:12px;color:var(--mut);text-align:left}
/* tabs */
.tabwrap{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 72%,transparent);padding:6px 0 12px}
.tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border:none;background:none;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background var(--d-fast),color var(--d-fast)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.tab.star[aria-selected="true"]{color:var(--deep);box-shadow:inset 0 0 0 1px rgba(243,162,62,.4)}
.panel{display:none}.panel.on{display:block;animation:fade var(--d-fast) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* status strip */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 16px;margin-bottom:16px;position:relative}
.status .it{display:flex;align-items:center;gap:7px}.status .it b{color:var(--tx);font-weight:700}
.status .sep{width:1px;height:15px;background:var(--bd2)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(70,201,138,.18)}
/* blocks */
.block{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 17px;margin-bottom:14px;position:relative}
.block.reach{border-top:3px solid var(--reach)}.block.deep{border-top:3px solid var(--deep)}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.bh h3{font-size:15.5px;font-weight:800}
.btag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.btag.r{background:rgba(54,214,198,.14);color:var(--reach)}.btag.d{background:rgba(243,162,62,.14);color:var(--deep)}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.explain{font-size:12px;color:var(--mut2);line-height:1.5;margin-top:8px}
.explain b{color:var(--mut);font-weight:600}
/* tooltip ? */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--card2);border:1px solid var(--bd2);color:var(--mut);font-size:10px;font-weight:800;cursor:help;margin-inline-start:5px;vertical-align:middle;flex:0 0 auto}
.tip:hover,.tip.show{background:var(--deep);color:#1a1206;border-color:var(--deep)}
.tiptext{display:none;position:absolute;bottom:calc(100% + 9px);inset-inline-end:50%;transform:translateX(50%);background:#232e40;border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:500;color:var(--tx);width:max-content;max-width:230px;line-height:1.55;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:right;white-space:normal}
.tip:hover .tiptext,.tip.show .tiptext{display:block;animation:fade var(--d-quick) var(--ease)}
/* ref badge */
.refbadge{display:none;position:absolute;top:-8px;inset-inline-start:12px;background:var(--deep);color:#1a1206;font-size:11px;font-weight:800;padding:1px 8px;border-radius:7px;letter-spacing:.3px;z-index:5}
body.editmode .refbadge{display:inline-block}
body.editmode .block,body.editmode .statcard,body.editmode .status{outline:1px dashed rgba(243,162,62,.35)}
/* stat cards */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}
.statcard{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:17px 18px 16px;position:relative;overflow:hidden}
.statcard.lead{border-top:3px solid var(--deep)}.statcard.r{border-top:3px solid var(--reach)}
.statcard .ico{position:absolute;top:14px;inset-inline-end:15px;color:var(--mut2);opacity:.7}.statcard .ico svg{width:18px;height:18px}
.statcard .t{font-size:12.5px;color:var(--mut);font-weight:600;display:flex;align-items:center}
.statcard .v{font-size:38px;font-weight:900;letter-spacing:-1.4px;line-height:1.05;margin:6px 0 5px}
.statcard .v.deep{color:var(--deep)}.statcard .v.reach{color:var(--reach)}
.statcard .v .unit{font-size:20px;font-weight:800;letter-spacing:-.5px}
.statcard .x{font-size:11.5px;color:var(--mut2);line-height:1.5}
.epstat{display:inline-flex;align-items:baseline;gap:3px}.epstat .ec{font-weight:900}.epstat .ep{color:var(--mut2);font-size:24px}
.statgrid.four{grid-template-columns:repeat(4,1fr)}
/* leaders */
.leaders{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.leadchip{flex:1 1 240px;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:11px;position:relative}
.leadchip .lic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(54,214,198,.13);color:var(--reach)}
.leadchip.d .lic{background:rgba(243,162,62,.13);color:var(--deep)}
.leadchip .lk{font-size:11px;color:var(--mut2);font-weight:600;display:flex;align-items:center}
.leadchip .lv{font-size:13.5px;font-weight:700;color:var(--tx)}.leadchip .lv b{color:var(--deep)}.leadchip .lv .n{font-variant-numeric:tabular-nums}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:0 9px 9px;white-space:nowrap}
th .tip{margin-inline-start:3px}
td{padding:9px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap}
.cell{position:relative}.cellbar{position:absolute;inset:0;border-radius:6px;opacity:.16;z-index:0}.cellv{position:relative;z-index:1;font-weight:600}
td.tot{font-weight:800;color:var(--deep)}
.scroll{overflow-x:auto;scrollbar-width:thin}
.miniretain{display:inline-flex;align-items:center;gap:6px}
.miniretain .rb{width:46px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.miniretain .rb>span{display:block;height:100%;background:var(--deep);border-radius:4px}
td.eps b{font-weight:800;color:var(--tx)}td.eps .epd{color:var(--mut2);font-size:11.5px}
/* funnel */
.funnel{display:flex;gap:9px;align-items:stretch}
.fseg{flex:1 1 0;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;position:relative}
.fseg .fl{font-size:11.5px;color:var(--mut);font-weight:600;display:flex;align-items:center}
.fseg .fv{font-size:25px;font-weight:900;letter-spacing:-.8px;margin-top:2px}
.fseg .fx{font-size:10.5px;color:var(--mut2);margin-top:1px}
.fseg.s1 .fv{color:#7d8ba8}.fseg.s2 .fv{color:#5a9bd6}.fseg.s3 .fv{color:var(--reach)}
.fconn{flex:0 0 auto;display:grid;place-items:center;color:var(--mut2);min-width:46px}
.fconn .pct{font-size:14px;font-weight:900;color:var(--tx)}.fconn .ar{color:var(--mut2);font-size:11px}
/* demo */
.demo .dl{display:grid;grid-template-columns:58px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:var(--mut);padding:3px 0}
.demo .db{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}.demo .db>span{display:block;height:100%}
.demo .dl .num{color:var(--tx);font-weight:600;text-align:left}
.glegend{display:flex;gap:12px;font-size:11px;color:var(--mut2);margin-bottom:8px;flex-wrap:wrap}
.glegend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:-1px}
/* social */
.pg{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.pg:first-child{border-top:none}
.pg .nm{font-weight:600}.pg .nm a{text-decoration:none;border-bottom:1px dotted var(--mut2);cursor:pointer}.pg .nm a:hover{border-bottom-style:solid}
.tag-sm{font-size:10px;color:var(--mut2);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin-inline-start:6px}
.pg .meta{font-size:11px;color:var(--mut2);margin-top:1px}
.pg .vv{font-size:16px;font-weight:800;text-align:left;white-space:nowrap}
.pg .bar{grid-column:1/-1;height:6px;background:var(--bg);border-radius:5px;overflow:hidden}.pg .bar>span{display:block;height:100%;border-radius:5px}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;margin-bottom:7px}
.post .pl{font-size:13px;font-weight:500}.post .pmeta{font-size:11px;color:var(--mut2);margin-top:2px}.post .pv{font-size:16px;font-weight:800}
/* spark + curve */
.sparkbox{height:54px}.curvebox{height:150px}
.gl{stroke:rgba(255,255,255,.06);stroke-width:1}.glt{fill:var(--mut2);font-size:9.5px}.xlab{fill:var(--mut2);font-size:9.5px}
/* benchmark */
.bbar{display:flex;flex-direction:column;gap:10px}
.bbrow{display:grid;grid-template-columns:188px 1fr auto;gap:11px;align-items:center;font-size:13px}
.bbrow .bl{color:var(--mut)}.bbrow .bl b{color:var(--tx);font-weight:700}
.bbrow .bw{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
.bbrow .bf{height:100%;border-radius:6px}
.bbrow .bv{font-weight:800;white-space:nowrap}.bbrow .bv .sm{color:var(--mut2);font-weight:500;font-size:11px}
.proj{background:rgba(243,162,62,.07);border:1px solid rgba(243,162,62,.22);border-radius:12px;padding:13px 15px}
.proj .pt{font-size:11px;font-weight:800;color:var(--deep);letter-spacing:.4px;margin-bottom:5px}
.note{font-size:11px;color:var(--mut2);font-style:italic;margin-top:7px;line-height:1.5}
/* matrix (compare) */
.mx{border-collapse:separate;border-spacing:0}
.mx th,.mx td{text-align:center;padding:8px 10px;font-size:13px}
.mx th:first-child,.mx td:first-child{text-align:right;position:sticky;inset-inline-start:0;background:var(--card);z-index:1}
.mx td{border-top:1px solid rgba(255,255,255,.06);position:relative}
.mx .ml{font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.mx .ml:hover{color:var(--tx)}
.mx .mcell{position:relative}.mx .mbar{position:absolute;inset:3px;border-radius:5px;opacity:.15;z-index:0}.mx .mv{position:relative;z-index:1;font-weight:700;font-variant-numeric:tabular-nums}
.mx .lead-cell .mv{color:var(--deep)}
.mxexp{font-size:12px;color:var(--mut);background:var(--card2);border-radius:8px;padding:8px 11px;margin:3px 0}
/* deep dive */
.dd-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dd-tab{font-size:12.5px;font-weight:600;color:var(--mut);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
.dd-tab.on{color:var(--tx);border-color:var(--bd2);background:var(--card)}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--bd2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two3{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--bd);font-size:11px;color:var(--mut2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1d2433;border:1px solid var(--bd2);padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:all var(--d-fast) var(--ease);z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){
  .statgrid,.statgrid.four{grid-template-columns:1fr;gap:10px}.statcard .v{font-size:32px}
  .two,.two3{grid-template-columns:1fr}.funnel{flex-direction:column}.fconn{min-height:28px;transform:rotate(90deg)}
  .leaders{flex-direction:column}.bbrow{grid-template-columns:1fr;gap:3px}.bbrow .bl{font-size:12px}
  table{font-size:12.5px}td,th{padding-inline:5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="vsw"><a class="edit" id="editToggle">✎ מצב עריכה</a></div>
  <header>
    <div class="brand">wedo<span class="s">|</span><span class="r">RE/MAX</span></div>
    <div class="hmeta"><span id="org"></span><br><span id="range"></span></div>
  </header>
  <div class="tabwrap"><div class="tabs" id="tabs"></div></div>
  <div id="panels"></div>
  <div class="foot"><span id="sources"></span><span>wedo | RE/MAX · אורגני</span></div>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
(function(){
"use strict";
var D=(window&&window.DASHBOARD_DATA)||null;
function nf(n){return (n==null||isNaN(n))?'–':Math.round(n).toLocaleString('en-US');}
function kf(n){return (n==null||isNaN(n))?'–':(n>=1000?(Math.round(n/100)/10).toLocaleString('en-US')+'K':Math.round(n).toLocaleString('en-US'));}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function RB(r){return '<span class="refbadge">'+r+'</span>';}
function pct(a,b){return b?Math.round(100*a/b):0;}
var COL={ig:'#ec5e9c',fb:'#4d8df5',yt:'#ff6a5a',sp:'#39d077',ap:'#a87bf0',reach:'#36d6c6',deep:'#f3a23e',male:'#4d8df5',female:'#ec5e9c',nb:'#a87bf0'};
if(!D){$('panels').innerHTML='<div class="block"><div class="bh"><h3>שגיאה בטעינת נתונים</h3></div><div class="sub">data.js לא נטען.</div></div>';return;}

var m=D.meta||{};
if($('org'))$('org').textContent=m.organic_note||'';
if($('range'))$('range').textContent=m.range||'';
if($('sources'))$('sources').textContent='מקורות: '+((m.sources||[]).join(' · '));

/* ---- tooltip dictionary ---- */
var TIPS={
  deep:'מי שהאזין לפרק שלם — לא רק לחץ. נספר ביוטיוב, ספוטיפיי ואפל.',
  reach:'כמה פעמים רילס נצפה. מדד רחב ונפרד — לא מסכמים אותו עם האזנה לפרק.',
  conv:'מתוך מי שנכנס לבדוק את התוכנית בספוטיפיי — כמה התחילו להאזין בפועל.',
  ytret:'איזה אחוז מאורך הסרטון נצפה בממוצע. ככל שגבוה יותר — מחזיקים יותר זמן.',
  unique:'מספר האנשים השונים שצפו — לא כולל צפיות חוזרות של אותו אדם.',
  reached:'ספוטיפיי הציג להם את התוכנית — בחיפוש או במסך הבית.',
  interested:'נכנסו לעמוד התוכנית כדי לבדוק.',
  consumed:'התחילו להאזין לפרק בפועל.',
  impressions:'כמה פעמים ספוטיפיי הציג את התוכנית למישהו (חשיפה, עוד לפני האזנה).',
  foreground:'האזינו בתשומת לב מלאה — לא ברקע תוך כדי משהו אחר.',
  median:'הזמן שבו המאזין החציוני עדיין החזיק בפרק.',
  curve:'מתוך מי שהתחיל את הפרק — כמה החזיקו עד כל נקודה. 100% = הגיעו לסוף.',
  episodes:'כל תוכנית מתוכננת ל-12 פרקים. אנחנו בתחילת הסדרה.',
  watch:'סך כל שעות הצפייה המצטברות ביוטיוב.',
  source_social:'החשיפה שייכת לעמוד שבו עלה הפוסט, לא לתוכנית — לכן זה מדד נפרד.'
};
function tip(k){var t=TIPS[k];return t?'<span class="tip" tabindex="0" data-tip="1">?<span class="tiptext">'+esc(t)+'</span></span>':'';}

/* ---- derive ---- */
var o=D.overview||{},shows=(D.shows||[]).slice(),social=D.social||{by_page:[]},B=D.benchmark||{};
var totDeep=(o.deep_listens!=null)?o.deep_listens:shows.reduce(function(a,s){return a+(s.deep_total||0);},0);
var totReach=(social.total_views!=null)?social.total_views:(o.reach_reels||0);
var pageCount=(social.page_count!=null)?social.page_count:(social.by_page?social.by_page.length:0);
var EP_PLANNED=12;
function pubEps(s){return (s.curves&&s.curves.length)||(s.episodes&&s.episodes.length)||0;}
var totPub=shows.reduce(function(a,s){return a+pubEps(s);},0),totPlan=shows.length*EP_PLANNED;
var byDeep=shows.slice().sort(function(a,b){return (b.deep_total||0)-(a.deep_total||0);});
var lead=byDeep, leadDeep=byDeep[0]||null;
var withFunnel=shows.filter(function(s){return s.funnel;});
var leadConv=withFunnel.slice().sort(function(a,b){return (b.funnel.i2c_pct||0)-(a.funnel.i2c_pct||0);})[0]||null;
var withYt=shows.filter(function(s){return s.yt&&s.yt.avg_pct!=null;});
var leadYt=withYt.slice().sort(function(a,b){return (b.yt.avg_pct||0)-(a.yt.avg_pct||0);})[0]||null;
var aggF=withFunnel.reduce(function(a,s){return {reached:a.reached+(s.funnel.reached||0),interested:a.interested+(s.funnel.interested||0),consumed:a.consumed+(s.funnel.consumed||0)};},{reached:0,interested:0,consumed:0});
var trendMap={};shows.forEach(function(s){(s.trend||[]).forEach(function(p){trendMap[p.d]=(trendMap[p.d]||0)+(p.v||0);});});
var trendKeys=Object.keys(trendMap).sort(),trendSeries=trendKeys.map(function(k){return trendMap[k];});
var AGE_ORDER=['18-22','23-27','28-34','35-44','45-59','60+','60-150'];
function ageRank(b){var i=AGE_ORDER.indexOf(b);return i<0?99:i;}
function ageRowsFor(list){var mp={};list.forEach(function(s){(s.age||[]).forEach(function(a){var br=a.displayName||a.ageBracket;if(!br||br==='Unknown'||br==='0-17')return;var c=(a.genderBreakdown&&a.genderBreakdown.counts)||[];function g(k){var f=c.filter(function(x){return x.gender===k;})[0];return f?f.count:0;}if(!mp[br])mp[br]={m:0,f:0,nb:0};mp[br].m+=g('MALE');mp[br].f+=g('FEMALE');mp[br].nb+=g('NON_BINARY')+g('NOT_SPECIFIED');});});return Object.keys(mp).map(function(br){var r=mp[br];return {br:br,m:r.m,f:r.f,nb:r.nb,n:r.m+r.f+r.nb};}).filter(function(r){return r.n>0;}).sort(function(a,b){return ageRank(a.br)-ageRank(b.br);});}

/* clean SVG sparkline (fixed height — no smear) */
function sparkSVG(series,h){h=h||54;if(!series.length)return '<div class="sub">אין נתוני מגמה</div>';
  var W=640,max=Math.max.apply(null,series.concat([1])),n=series.length;
  var X=function(i){return 4+(n>1?i*(W-8)/(n-1):0);},Y=function(v){return 4+(1-v/max)*(h-8);};
  var ln=series.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
  var ar='M'+X(0).toFixed(1)+' '+(h-4)+' '+ln.slice(1)+' L'+X(n-1).toFixed(1)+' '+(h-4)+' Z';
  return '<svg viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px;overflow:visible"><path d="'+ar+'" fill="'+COL.reach+'" opacity=".1"/><path d="'+ln+'" fill="none" stroke="'+COL.reach+'" stroke-width="2"/></svg>';
}

/* ================= BENCHMARK (מול השוק — internal) ================= */
function buildBenchmark(){
  var mature=(B.growth&&B.growth.mature||[]).filter(function(x){return x.month1!=null;});
  // pick the most FLATTERING parallels: veterans that started SMALL and grew huge (sorted by all_time)
  var grewSmall=mature.filter(function(x){return x.month1<=900;}).sort(function(a,b){return (b.all_time||0)-(a.all_time||0);});
  var topVets=mature.slice().sort(function(a,b){return (b.all_time||0)-(a.all_time||0);}).slice(0,4);
  var ourLead=(B.growth&&B.growth.remax||[])[0]||{name:'המבוגר האחראי',month1:116};
  // month-1 compare: our lead vs veterans-that-started-small
  var m1rows=[{lbl:'<b>'+esc(ourLead.name)+'</b> (RE/MAX, היום)',v:ourLead.month1,col:COL.deep,sm:(ourLead.days||19)+' ימים'}]
    .concat(grewSmall.slice(0,3).map(function(x){return {lbl:'פודקאסט ותיק '+x.label+' · היום '+kf(x.all_time),v:x.month1,col:'#6f7da0',sm:'חודש 1 שלו'};}));
  var m1mx=Math.max.apply(null,m1rows.map(function(r){return r.v;}).concat([1]));
  // potential: where veterans are TODAY
  var potRows=topVets.map(function(x){return {lbl:'פודקאסט ותיק '+x.label,v:x.all_time,col:COL.reach};});
  potRows.push({lbl:'<b>'+esc(ourLead.name)+'</b> (היום)',v:leadDeep?leadDeep.deep_total:416,col:COL.deep});
  var potMx=Math.max.apply(null,potRows.map(function(r){return r.v;}).concat([1]));
  // growth shape: month 1→2→3 of a veteran that started small (clearest story)
  var shapeVet=grewSmall[0]||topVets[0];
  var sy=B.synthesis||{};
  function bbar(rows,mx,fmt){return '<div class="bbar">'+rows.map(function(r){return '<div class="bbrow"><span class="bl">'+r.lbl+'</span><div class="bw"><div class="bf" style="width:'+Math.max(3,pct(r.v,mx))+'%;background:'+r.col+'"></div></div><span class="bv num">'+fmt(r.v)+(r.sm?' <span class="sm">· '+r.sm+'</span>':'')+'</span></div>';}).join('')+'</div>';}
  var out='<div class="block deep">'+RB('B1')+'<div class="bh"><span class="btag d">מול השוק</span><h3>איפה אנחנו — מול הפודקאסטים שלנו</h3></div>'+
    '<div class="sub">לא משווים לכל העולם — משווים למה שאנחנו מכירים: הפודקאסטים של WeDo עצמם, שכמה מהם התחילו בדיוק כאן והיום מונים מאות-אלפי האזנות.</div></div>';
  out+='<div class="block">'+RB('B2')+'<div class="bh"><h3>חודש ראשון · אנחנו מול תוכניות שלנו שצמחו</h3></div>'+
    '<div class="sub">החודש הראשון של המוביל שלנו, מול החודש הראשון של פודקאסטים ותיקים בפורטפוליו (אנונימי) שהיום ענקיים.</div>'+
    bbar(m1rows,m1mx,nf)+
    (shapeVet?'<div class="explain"><b>פודקאסט ותיק '+shapeVet.label+'</b> עשה '+nf(shapeVet.month1)+' בחודש הראשון'+(shapeVet.month2!=null?', אפילו '+nf(shapeVet.month2)+' בלבד בחודש השני':'')+' — והיום '+kf(shapeVet.all_time)+'. ההתחלה לא מנבאת את התקרה.</div>':'')+'</div>';
  // growth shape mini chart (month 1/2/3)
  if(shapeVet&&shapeVet.month3!=null){
    var sm=[shapeVet.month1,shapeVet.month2,shapeVet.month3],smx=Math.max.apply(null,sm.concat([1]));
    var W=560,H=120,pl=8,pb=20,pt=8;
    var X=function(i){return pl+i*(W-pl-8)/2;},Y=function(v){return pt+(1-v/smx)*(H-pt-pb);};
    var pts=sm.map(function(v,i){return [X(i),Y(v)];});
    var ln=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    var dots=pts.map(function(p,i){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+COL.reach+'"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-9).toFixed(1)+'" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">'+nf(sm[i])+'</text>';}).join('');
    var xl=['חודש 1','חודש 2','חודש 3'].map(function(t,i){return '<text class="xlab" x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+t+'</text>';}).join('');
    out+='<div class="block">'+RB('B3')+'<div class="bh"><span class="btag d">צמיחה</span><h3>צורת הצמיחה · 3 חודשים ראשונים</h3></div>'+
      '<div class="sub">פודקאסט ותיק '+shapeVet.label+' (היום '+kf(shapeVet.all_time)+') — איטי בהתחלה, הצמיחה מגיעה אחר כך.</div>'+
      '<div class="curvebox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:120px;overflow:visible"><path d="M'+pl+' '+(H-pb)+' '+ln.slice(1)+' L'+X(2).toFixed(1)+' '+(H-pb)+' Z" fill="'+COL.reach+'" opacity=".1"/><path d="'+ln+'" fill="none" stroke="'+COL.reach+'" stroke-width="2.4"/>'+dots+xl+'</svg></div></div>';
  }
  out+='<div class="block">'+RB('B4')+'<div class="bh"><span class="btag r">פוטנציאל</span><h3>לאן אפשר להגיע</h3></div>'+
    '<div class="sub">היכן הפודקאסטים הוותיקים שלנו עומדים היום (סך האזנות) — מול המוביל שלנו עכשיו.</div>'+
    bbar(potRows,potMx,kf)+'</div>';
  if(sy.projection&&sy.projection.statement_he){
    out+='<div class="block">'+RB('B5')+'<div class="proj"><div class="pt">▸ תחזית (לא הבטחה)</div><div style="font-size:13px;line-height:1.6;color:#e8ebf1">'+esc(sy.projection.statement_he)+'</div><div class="note">בסיס: '+esc(sy.projection.basis||'')+'</div></div></div>';
  }
  return out;
}

  // retention curve — only for episodes with enough listens
  if(curvesBig.length){
    out+='<div class="block deep">'+RB('S'+idx+'f')+'<div class="bh"><span class="btag d">עומק</span><h3>עד כמה מקשיבים לפרק'+tip('curve')+'</h3></div><div class="sub">מתוך מי שהתחיל את הפרק — כמה החזיקו עד כל נקודה. (פרקים עם מספיק האזנות בלבד.)</div><div class="curvebox" id="cv-'+idx+'"></div><div id="cvleg-'+idx+'" class="glegend" style="margin-top:6px"></div></div>';
  }
  out+='<div class="two">'+
    '<div class="block">'+RB('S'+idx+'g')+'<div class="bh"><h3>ביצועים לפי פרק</h3></div><div class="sub">האזנות ספוטיפיי · זמן חציוני'+tip('median')+'</div><table><tbody>'+
    ((s.curves||[]).map(function(e,i){return '<tr><td>'+(i+1)+'. '+esc(e.title.replace(/^פרק \d+ - /,'').slice(0,28))+'</td><td class="num" style="text-align:left;font-weight:700">'+nf(e.count)+'</td><td class="num" style="text-align:left;color:var(--mut)">'+(e.median_completion_sec?Math.round(e.median_completion_sec/60)+'ד׳':'')+'</td></tr>';}).join('')||'<tr><td class="sub">אין נתונים</td></tr>')+'</tbody></table></div>'+
    '<div class="block reach">'+RB('S'+idx+'h')+'<div class="bh"><span class="btag r">חשיפה</span><h3>רילס שעלו על התוכנית</h3></div><div class="explain" style="margin-top:0;margin-bottom:9px">בעמודים שונים — החשיפה היא של העמוד שבו עלה הפוסט.</div>'+
    (posts.map(function(pp){var inner='<div><div class="pl">'+esc(pp.label)+'</div><div class="pmeta">עלה ב: '+esc(pp.account)+' · '+pp.platform+' · ❤ '+nf(pp.likes)+'</div></div><div class="pv num" style="color:'+(pp.platform==='Instagram'?COL.ig:COL.fb)+'">'+nf(pp.views)+'</div>';return pp.url?'<a class="post" href="'+esc(pp.url)+'" target="_blank" rel="noopener">'+inner+'</a>':'<div class="post">'+inner+'</div>';}).join('')||'<div class="sub">אין רילס שזוהו</div>')+'</div>'+
  '</div>'+
  '<div class="block">'+RB('S'+idx+'i')+'<div class="bh"><h3>גיל ומגדר הקהל · ספוטיפיי</h3></div>'+
    (s.demo_reliable?'<div class="sub">לפי '+nf(s.spotify_streams)+' האזנות.</div>'+ageBars(ages):'<div class="sub">מדגם קטן מדי לפילוח אמין ('+nf(s.spotify_streams)+' האזנות) — נציג כשייצבר.</div>')+'</div>';
  return out;
}
function drawShowCurve(idx){
  var s=shows[idx];if(!s)return;var big=(s.curves||[]).filter(function(e){return (e.count||0)>=10;}).slice(0,4);
  var box=$('cv-'+idx);if(!box||!big.length)return;
  var W=640,H=150,pl=30,pb=20,pt=8,xs=[0,25,50,75,95,100],cols=['#f3a23e','#36d6c6','#4d8df5','#a87bf0'];
  var g='';for(var k=0;k<=2;k++){var v=100*k/2,y=pt+(1-v/100)*(H-pt-pb);g+='<line class="gl" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'"/><text class="glt" x="'+(pl-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+v+'%</text>';}
  var paths='',leg='';
  big.forEach(function(e,ci){var col=cols[ci%4];
    var pp=xs.map(function(x){var yv=(x===0)?100:(e.retention&&(e.retention['p'+x]!=null?e.retention['p'+x]:e.retention[x])||0);var X=pl+(x/100)*(W-pl-6),Y=pt+(1-yv/100)*(H-pt-pb);return [X,Y];});
    paths+='<path d="'+pp.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.2" opacity=".9"/>';
    leg+='<span><i style="background:'+col+'"></i>'+esc(e.title.replace(/^פרק (\d+).*/,'פרק $1'))+(e.median_completion_sec?' · '+Math.round(e.median_completion_sec/60)+'ד׳':'')+(e.foreground_pct!=null?' · '+Math.round(e.foreground_pct*100)+'% הקשבה אמיתית':'')+'</span>';});
  var xl=xs.map(function(x){var X=pl+(x/100)*(W-pl-6);return '<text class="xlab" x="'+X.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+x+'%</text>';}).join('');
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px;overflow:visible">'+g+paths+xl+'</svg>';
  var lg=$('cvleg-'+idx);if(lg)lg.innerHTML=leg;
}

/* ================= COMPARE (matrix) ================= */
var MX_METRICS=[
  {k:'deep',name:'סך האזנה',tip:'deep',get:function(s){return s.deep_total;},fmt:nf},
  {k:'yt',name:'YouTube',get:function(s){return s.platforms.youtube;},fmt:nf},
  {k:'sp',name:'Spotify',get:function(s){return s.platforms.spotify;},fmt:nf},
  {k:'uniq',name:'צופים ייחודיים',tip:'unique',get:function(s){return s.yt&&s.yt.unique_viewers;},fmt:nf},
  {k:'watch',name:'שעות צפייה',tip:'watch',get:function(s){return s.yt&&s.yt.watch_hours;},fmt:function(v){return v==null?'–':Math.round(v);}},
  {k:'ytret',name:'שימור YT %',tip:'ytret',get:function(s){return s.yt&&s.yt.avg_pct;},fmt:function(v){return v==null?'–':v+'%';}},
  {k:'impr',name:'חשיפות ספוטיפיי',tip:'impressions',get:function(s){return s.impressions&&s.impressions.total;},fmt:nf},
  {k:'conv',name:'המרה (צרכו/התעניינו)',tip:'conv',get:function(s){return s.funnel&&s.funnel.i2c_pct;},fmt:function(v){return v==null?'–':v+'%';}},
  {k:'reach',name:'חשיפה בסושיאל',tip:'reach',get:function(s){return (s.instagram_views||0)+(s.facebook_views||0);},fmt:nf}
];
function buildCompare(){
  var h='<div class="block">'+RB('CMP1')+'<div class="bh"><h3>השוואה · כל המדדים, כל התוכניות</h3></div><div class="sub">לחיצה על שם מדד פותחת הסבר. הצבע = מי מוביל בכל שורה.</div>'+
    '<div class="scroll"><table class="mx"><thead><tr><th>מדד</th>'+shows.map(function(s){return '<th>'+esc(s.name)+'</th>';}).join('')+'</tr></thead><tbody>';
  MX_METRICS.forEach(function(mt,mi){
    var vals=shows.map(function(s){var v=mt.get(s);return (v==null||isNaN(v))?null:v;});
    var mx=Math.max.apply(null,vals.filter(function(v){return v!=null;}).concat([1]));
    var leadIdx=vals.indexOf(Math.max.apply(null,vals.filter(function(v){return v!=null;}).concat([-1])));
    h+='<tr><td class="ml" onclick="(function(e){var x=document.getElementById(\'mxe-'+mi+'\');x.style.display=x.style.display===\'table-row\'?\'none\':\'table-row\';})()">'+esc(mt.name)+(mt.tip?tip(mt.tip):'')+'</td>';
    shows.forEach(function(s,si){var v=vals[si];h+='<td class="mcell'+(si===leadIdx&&v!=null?' lead-cell':'')+'">'+(v!=null?'<span class="mbar" style="background:'+(si===leadIdx?COL.deep:COL.reach)+';width:'+pct(v,mx)+'%"></span>':'')+'<span class="mv">'+mt.fmt(v)+'</span></td>';});
    h+='</tr>';
    if(mt.tip)h+='<tr id="mxe-'+mi+'" style="display:none"><td colspan="'+(shows.length+1)+'"><div class="mxexp">'+esc(TIPS[mt.tip]||'')+'</div></td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

/* ================= DEEP DIVE ================= */
function buildDeepDive(){
  return '<div class="toolbar">'+RB('DD0')+
    '<button class="btn" onclick="window.__exportJSON()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>ייצא הכל · JSON</button>'+
    '<button class="btn" onclick="window.__exportCSV()"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>ייצא טבלאות · CSV</button>'+
  '</div>'+
  '<div class="block">'+RB('DD1')+'<div class="bh"><h3>כל הפרקים · נתונים מלאים</h3></div><div class="sub">האזנות, זמן חציוני, הקשבה אמיתית'+tip('foreground')+', וגודל קהל — פר פרק.</div>'+
    '<div class="scroll"><table><thead><tr><th>תוכנית</th><th>פרק</th><th>האזנות</th><th>זמן חציוני'+tip('median')+'</th><th>הקשבה אמיתית'+tip('foreground')+'</th><th>קהל</th><th>שימור 25%</th><th>50%</th><th>סוף</th></tr></thead><tbody>'+
    shows.map(function(s){return (s.curves||[]).map(function(e){var r=e.retention||{};function rr(x){var v=r['p'+x]!=null?r['p'+x]:r[x];return v!=null?Math.round(v)+'%':'–';}
      return '<tr><td class="nm">'+esc(s.name)+'</td><td>'+esc(e.title.replace(/^פרק (\d+).*/,'פרק $1'))+'</td><td class="num">'+nf(e.count)+'</td><td class="num">'+(e.median_completion_sec?Math.round(e.median_completion_sec/60)+'ד׳':'–')+'</td><td class="num">'+(e.foreground_pct!=null?Math.round(e.foreground_pct*100)+'%':'–')+'</td><td class="num">'+nf(e.total_audience)+'</td><td class="num">'+rr(25)+'</td><td class="num">'+rr(50)+'</td><td class="num">'+rr(100)+'</td></tr>';}).join('');}).join('')+
    '</tbody></table></div></div>'+
  '<div class="block">'+RB('DD2')+'<div class="bh"><h3>מקורות חשיפה בספוטיפיי'+tip('impressions')+'</h3></div><div class="sub">איך אנשים נתקלים בתוכנית בתוך ספוטיפיי.</div>'+
    '<div class="scroll"><table><thead><tr><th>תוכנית</th><th>סך חשיפות</th><th>חיפוש</th><th>מסך הבית</th><th>ספרייה</th></tr></thead><tbody>'+
    shows.map(function(s){var src=(s.impressions&&s.impressions.sources)||[];function f(n){var x=src.filter(function(c){return c.name===n;})[0];return x?nf(x.count):'–';}
      return '<tr><td class="nm">'+esc(s.name)+'</td><td class="num">'+nf(s.impressions&&s.impressions.total)+'</td><td class="num">'+f('Search')+'</td><td class="num">'+f('Home')+'</td><td class="num">'+f('Library')+'</td></tr>';}).join('')+
    '</tbody></table></div></div>'+
  '<div class="block">'+RB('DD3')+'<div class="bh"><h3>כל הרילס · סושיאל</h3></div><div class="sub">כל הפוסטים שזוהו, לפי צפיות.</div>'+
    '<div class="scroll"><table><thead><tr><th>עמוד</th><th>פלטפורמה</th><th>תיאור</th><th>צפיות</th><th>לייקים</th></tr></thead><tbody>'+
    ((social.posts||[]).map(function(pp){return '<tr><td class="nm">'+esc(pp.account)+'</td><td>'+pp.platform+'</td><td>'+esc((pp.label||'').slice(0,40))+'</td><td class="num">'+nf(pp.views)+'</td><td class="num">'+nf(pp.likes)+'</td></tr>';}).join('')||'<tr><td class="sub">אין</td></tr>')+
    '</tbody></table></div></div>';
}

/* ---- export ---- */
window.__exportJSON=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='remax-wedo-data.json';a.click();toast('הנתונים יוצאו · JSON');};
window.__exportCSV=function(){
  var rows=[['תוכנית','פרקים','סך האזנה','YouTube','Spotify','Apple','צופים ייחודיים','שעות צפייה','שימור YT%','חשיפות ספוטיפיי','המרה%']];
  shows.forEach(function(s){rows.push([s.name,pubEps(s),s.deep_total,s.platforms.youtube,s.platforms.spotify,s.platforms.apple,s.yt&&s.yt.unique_viewers,s.yt&&s.yt.watch_hours,s.yt&&s.yt.avg_pct,s.impressions&&s.impressions.total,s.funnel&&s.funnel.i2c_pct]);});
  rows.push([],['עמוד','פלטפורמה','סוג','פוסטים','חשיפה']);(social.by_page||[]).forEach(function(p){rows.push([p.page,p.platform,p.type,p.posts,p.views]);});
  var c='﻿'+rows.map(function(r){return r.join(',');}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='remax-wedo.csv';a.click();toast('הטבלאות יוצאו · CSV');
};
function toast(msg){var t=$('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}

/* ---- tabs ---- */
var TABS=[{k:'ov',name:'סקירה'},{k:'bm',name:'מול השוק',star:1}].concat(shows.map(function(s,i){return {k:'s'+i,name:s.name};})).concat([{k:'cmp',name:'השוואה'},{k:'dd',name:'Deep Dive'}]);
var tabsEl=$('tabs'),panelsEl=$('panels');
TABS.forEach(function(t,i){var b=document.createElement('button');b.className='tab'+(t.star?' star':'');b.textContent=t.name;b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=function(){sel(i);};tabsEl.appendChild(b);var p=document.createElement('div');p.className='panel'+(i===0?' on':'');p.id='pan'+i;panelsEl.appendChild(p);});
function buildTab(i){var t=TABS[i],p=$('pan'+i);if(p.dataset.built)return;
  try{
    if(t.k==='ov')p.innerHTML=buildOverview();
    else if(t.k==='bm')p.innerHTML=buildBenchmark();
    else if(t.k==='cmp')p.innerHTML=buildCompare();
    else if(t.k==='dd')p.innerHTML=buildDeepDive();
    else {var idx=+t.k.slice(1);p.innerHTML=buildShow(shows[idx],idx);drawShowCurve(idx);}
  }catch(e){if(window.console)console.error('tab '+t.k,e);p.innerHTML='<div class="block"><div class="bh"><h3>שגיאה</h3></div><div class="sub">'+esc(e&&e.message||e)+'</div></div>';}
  p.dataset.built='1';
}
function sel(i){[].forEach.call(tabsEl.children,function(t,j){t.setAttribute('aria-selected',i===j?'true':'false');});buildTab(i);[].forEach.call(panelsEl.children,function(p,j){p.classList.toggle('on',i===j);});window.scrollTo({top:0,behavior:'smooth'});}

/* ---- tooltip tap (mobile) ---- */
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('.tip');
  document.querySelectorAll('.tip.show').forEach(function(x){if(x!==t)x.classList.remove('show');});
  if(t){e.stopPropagation();t.classList.toggle('show');}});

/* ---- edit mode ---- */
(function(){var t=$('editToggle');if(t)t.onclick=function(){document.body.classList.toggle('editmode');this.classList.toggle('on');};})();

buildTab(0);
})();
</script>
