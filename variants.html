<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE/MAX × WeDo — סקירה · 3 וריאנטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --d-fast:250ms; --d-quick:150ms; --ease:cubic-bezier(.22,1,.36,1);
  --bg:#0b0e15; --card:#151a25; --card2:#1b2230; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.17);
  --tx:#f1f3f8; --mut:#9aa2b2; --mut2:#6b7488;
  --reach:#36d6c6; --deep:#f3a23e; --good:#46c98a; --warn:#e0b34d;
  --ig:#ec5e9c; --fb:#4d8df5; --yt:#ff6a5a; --sp:#39d077; --ap:#a87bf0;
  --male:#4d8df5; --female:#ec5e9c; --nb:#a87bf0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";font-size:15px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 70px}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
a{color:inherit}

/* top bar */
.vsw{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 0 4px}
.vsw a{font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:none;padding:6px 13px;border:1px solid var(--bd);border-radius:20px;transition:all var(--d-fast)}
.vsw a.back{margin-inline-end:auto}
.vsw a:hover{color:var(--tx);border-color:var(--bd2)}
.vsw .edit{margin-inline-start:auto;cursor:pointer}
.vsw .edit.on{background:rgba(243,162,62,.16);color:var(--deep);border-color:rgba(243,162,62,.4)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0 10px}
.brand{font-weight:900;font-size:18px}.brand .s{color:var(--mut2);font-weight:300;margin:0 6px}.brand .r{color:var(--reach)}
.hmeta{font-size:12px;color:var(--mut);text-align:left}

/* variant toggle pills */
.pillwrap{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 72%,transparent);padding:6px 0 14px}
.pills{display:flex;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:1 1 0;min-width:120px;padding:10px 14px;border:none;background:none;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:700;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background var(--d-fast),color var(--d-fast);text-align:center}
.pill[aria-selected="true"]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.pill .vk{font-size:11px;color:var(--mut2);display:block;font-weight:600;margin-top:1px}
.pill[aria-selected="true"] .vk{color:var(--reach)}

.variant{display:none}.variant.on{display:block;animation:fade var(--d-fast) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* status strip */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 16px;margin-bottom:16px;position:relative}
.status .it{display:flex;align-items:center;gap:7px}
.status .it b{color:var(--tx);font-weight:700}
.status .sep{width:1px;height:15px;background:var(--bd2)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(70,201,138,.18)}

/* generic block */
.block{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 17px;margin-bottom:14px;position:relative}
.block.reach{border-top:3px solid var(--reach)}.block.deep{border-top:3px solid var(--deep)}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.bh h3{font-size:15.5px;font-weight:800}
.btag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.btag.r{background:rgba(54,214,198,.14);color:var(--reach)}.btag.d{background:rgba(243,162,62,.14);color:var(--deep)}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.explain{font-size:12px;color:var(--mut2);line-height:1.5;margin-top:3px}
.explain b{color:var(--mut);font-weight:600}

/* ref badge */
.refbadge{display:none;position:absolute;top:-8px;inset-inline-start:12px;background:var(--deep);color:#1a1206;font-size:11px;font-weight:800;padding:1px 8px;border-radius:7px;letter-spacing:.3px;z-index:5}
body.editmode .refbadge{display:inline-block}
body.editmode .block,body.editmode .statcard,body.editmode .status,body.editmode .widget{outline:1px dashed rgba(243,162,62,.35)}

/* === STAT CARDS (KPI) === */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}
.statcard{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:17px 18px 16px;position:relative;overflow:hidden}
.statcard.lead{border-top:3px solid var(--deep)}
.statcard.r{border-top:3px solid var(--reach)}
.statcard .ico{position:absolute;top:14px;inset-inline-end:15px;color:var(--mut2);opacity:.7}
.statcard .ico svg{width:18px;height:18px}
.statcard .t{font-size:12.5px;color:var(--mut);font-weight:600}
.statcard .v{font-size:38px;font-weight:900;letter-spacing:-1.4px;line-height:1.05;margin:6px 0 5px}
.statcard .v.deep{color:var(--deep)}.statcard .v.reach{color:var(--reach)}
.statcard .v .unit{font-size:20px;font-weight:800;letter-spacing:-.5px}
.statcard .x{font-size:11.5px;color:var(--mut2);line-height:1.5}

/* leaders line */
.leaders{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.leadchip{flex:1 1 240px;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:11px}
.leadchip .lic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(54,214,198,.13);color:var(--reach)}
.leadchip.d .lic{background:rgba(243,162,62,.13);color:var(--deep)}
.leadchip .ld{min-width:0}
.leadchip .lk{font-size:11px;color:var(--mut2);font-weight:600}
.leadchip .lv{font-size:13.5px;font-weight:700;color:var(--tx)}
.leadchip .lv b{color:var(--deep)}.leadchip .lv .n{font-variant-numeric:tabular-nums}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:0 9px 9px;white-space:nowrap}
td{padding:9px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap}
.cell{position:relative}.cellbar{position:absolute;inset:0;border-radius:6px;opacity:.16;z-index:0}.cellv{position:relative;z-index:1;font-weight:600}
td.tot{font-weight:800;color:var(--deep)}
.scroll{overflow-x:auto;scrollbar-width:thin}
.miniretain{display:inline-flex;align-items:center;gap:6px}
.miniretain .rb{width:46px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.miniretain .rb>span{display:block;height:100%;background:var(--deep);border-radius:4px}
td.eps{white-space:nowrap}td.eps b{font-weight:800;color:var(--tx)}td.eps .epd{color:var(--mut2);font-size:11.5px}
.epstat{display:inline-flex;align-items:baseline;gap:3px}.epstat .ec{font-weight:900}.epstat .ep{color:var(--mut2)}

/* compact funnel strip */
.funnel{display:flex;gap:9px;align-items:stretch}
.fseg{flex:1 1 0;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;position:relative}
.fseg .fl{font-size:11.5px;color:var(--mut);font-weight:600}
.fseg .fv{font-size:25px;font-weight:900;letter-spacing:-.8px;margin-top:2px}
.fseg .fx{font-size:10.5px;color:var(--mut2);margin-top:1px}
.fseg.s1 .fv{color:#7d8ba8}.fseg.s2 .fv{color:#5a9bd6}.fseg.s3 .fv{color:var(--reach)}
.fconn{flex:0 0 auto;display:grid;place-items:center;color:var(--mut2);font-size:11px;font-weight:800;min-width:46px}
.fconn .pct{font-size:14px;font-weight:900;color:var(--tx)}
.fconn .ar{color:var(--mut2)}

/* demo bars (age+gender) */
.demo .dl{display:grid;grid-template-columns:58px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:var(--mut);padding:3px 0}
.demo .db{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}
.demo .db>span{display:block;height:100%}
.demo .dl .num{color:var(--tx);font-weight:600;text-align:left}
.glegend{display:flex;gap:12px;font-size:11px;color:var(--mut2);margin-bottom:8px;flex-wrap:wrap}
.glegend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:-1px}

/* social by page */
.pg{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.pg:first-child{border-top:none}
.pg .nm{font-weight:600}.pg .nm a{text-decoration:none;border-bottom:1px dotted var(--mut2);cursor:pointer}
.pg .nm a:hover{border-bottom-style:solid}
.tag-sm{font-size:10px;color:var(--mut2);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin-inline-start:6px}
.pg .meta{font-size:11px;color:var(--mut2);margin-top:1px}
.pg .vv{font-size:16px;font-weight:800;text-align:left;white-space:nowrap}
.pg .bar{grid-column:1/-1;height:6px;background:var(--bg);border-radius:5px;overflow:hidden}
.pg .bar>span{display:block;height:100%;border-radius:5px}

/* sparkline fallback container */
.sparkbox{min-height:48px}
.apxmini{min-height:0}
.chartfallback{font-size:11.5px;color:var(--mut2);padding:8px 0}

/* layout helpers */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two3{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}

/* === VARIANT B : dense grid === */
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:13px 14px;position:relative}
.tile.lead{border-top:3px solid var(--deep)}.tile.r{border-top:3px solid var(--reach)}
.tile .t{font-size:11px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
.tile .v{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:3px}
.tile .v.deep{color:var(--deep)}.tile .v.reach{color:var(--reach)}
.tile .x{font-size:10.5px;color:var(--mut2);margin-top:1px}
.tile .ico{position:absolute;top:11px;inset-inline-end:12px;color:var(--mut2);opacity:.7}
.tile .ico svg{width:15px;height:15px}
.wgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.wgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.widget{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;position:relative}
.widget h4{font-size:13.5px;font-weight:800;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.widget .ws{font-size:11px;color:var(--mut2);margin-bottom:9px}
.widget table{font-size:13px}.widget th{padding:0 6px 7px;font-size:10.5px}.widget td{padding:6px}

/* === VARIANT C : editorial === */
.editorial{max-width:880px;margin:0 auto}
.headline{font-size:25px;font-weight:800;line-height:1.5;letter-spacing:-.3px;margin:8px 0 4px;color:#eef1f6}
.headline b{color:var(--deep);font-weight:900}
.headline .reach{color:var(--reach)}
.lede{font-size:14px;color:var(--mut);line-height:1.7;margin-bottom:26px;max-width:680px}
.bignum{text-align:center;padding:26px 0 22px;margin-bottom:8px}
.bignum .v{font-size:78px;font-weight:900;letter-spacing:-4px;line-height:1;color:var(--deep)}
.bignum .v .unit{font-size:34px;letter-spacing:-1px}
.bignum .t{font-size:14px;color:var(--mut);font-weight:600;margin-top:8px}
.bignum .x{font-size:12px;color:var(--mut2);margin-top:5px}
.bignum .pair{display:flex;justify-content:center;gap:46px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--bd)}
.bignum .pair .pv{font-size:30px;font-weight:900;letter-spacing:-1px}
.bignum .pair .pv.reach{color:var(--reach)}
.bignum .pair .pl{font-size:12px;color:var(--mut);margin-top:3px}
.eblock{margin-bottom:32px;position:relative}
.eblock .eh{font-size:16px;font-weight:800;margin-bottom:3px}
.eblock .es{font-size:12.5px;color:var(--mut2);margin-bottom:14px;line-height:1.6}
.eblock.refhost{padding-top:4px}

.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--bd);font-size:11px;color:var(--mut2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media(max-width:760px){
  .statgrid{grid-template-columns:1fr;gap:10px}
  .statcard .v{font-size:32px}
  .bgrid{grid-template-columns:1fr 1fr}
  .wgrid,.wgrid3,.two,.two3{grid-template-columns:1fr}
  .funnel{flex-direction:column}
  .fconn{min-height:30px;transform:rotate(90deg)}
  .leaders{flex-direction:column}
  table{font-size:12.5px}td,th{padding-inline:5px}
  .headline{font-size:20px}.bignum .v{font-size:58px}.bignum .pair{gap:30px}
  .pill{min-width:96px;font-size:12.5px;padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="vsw">
    <a class="back" href="index.html">← חזרה לדשבורד</a>
    <a class="edit" id="editToggle">✎ מצב עריכה</a>
  </div>
  <header>
    <div class="brand">wedo<span class="s">|</span><span class="r">RE/MAX</span></div>
    <div class="hmeta"><span id="org"></span><br><span id="range"></span></div>
  </header>

  <div class="pillwrap">
    <div class="pills" id="pills" role="tablist"></div>
  </div>

  <div id="vA" class="variant on"></div>
  <div id="vB" class="variant"></div>
  <div id="vC" class="variant"></div>

  <div class="foot"><span id="sources"></span><span>wedo | RE/MAX · אורגני · סקירה (3 וריאנטים)</span></div>
</div>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts" defer></script>
<script>
(function(){
"use strict";
var D = (window && window.DASHBOARD_DATA) || null;

/* ---------- helpers ---------- */
function nf(n){ if(n==null||isNaN(n)) return '–'; return Math.round(n).toLocaleString('en-US'); }
function kf(n){ if(n==null||isNaN(n)) return '–'; return n>=1000 ? (Math.round(n/100)/10).toLocaleString('en-US')+'K' : Math.round(n).toLocaleString('en-US'); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function RB(r){ return '<span class="refbadge">'+r+'</span>'; }
function pct(a,b){ return b? Math.round(100*a/b) : 0; }

var COL = {ig:'#ec5e9c',fb:'#4d8df5',yt:'#ff6a5a',sp:'#39d077',ap:'#a87bf0',reach:'#36d6c6',deep:'#f3a23e',male:'#4d8df5',female:'#ec5e9c',nb:'#a87bf0'};

/* ---------- guards: if data missing, show a clear message instead of white-screen ---------- */
if(!D){
  ['vA','vB','vC'].forEach(function(id){
    var elx=$(id); if(elx) elx.innerHTML='<div class="block"><div class="bh"><h3>שגיאה בטעינת נתונים</h3></div><div class="sub">data.js לא נטען (window.DASHBOARD_DATA חסר).</div></div>';
  });
  return;
}

/* ---------- header meta ---------- */
(function(){
  var m=D.meta||{};
  if($('org')) $('org').textContent = m.organic_note||'';
  if($('range')) $('range').textContent = m.range||'';
  if($('sources')) $('sources').textContent = 'מקורות: '+((m.sources||[]).join(' · '));
})();

/* ---------- derive everything ONCE from the data (no invented numbers) ---------- */
var o = D.overview||{};
var shows = (D.shows||[]).slice();
var social = D.social||{by_page:[]};
var B = D.benchmark||{};

var totDeep = (o.deep_listens!=null)? o.deep_listens : shows.reduce(function(a,s){return a+(s.deep_total||0);},0);
var totReach = (social.total_views!=null)? social.total_views : (o.reach_reels||0);
var pageCount = (social.page_count!=null)? social.page_count : (social.by_page? social.by_page.length : 0);

/* episode progress — every RE/MAX podcast is planned for 12 episodes.
   published per show = count of episodes with retention curves (the real published-and-measured episodes). */
var EPISODES_PLANNED = 12;
function publishedEps(s){ return (s.curves && s.curves.length) || (s.episodes && s.episodes.length) || 0; }
var totalPublished = shows.reduce(function(a,s){return a+publishedEps(s);},0);
var totalPlanned = shows.length * EPISODES_PLANNED;

/* leaders — COMPUTED from D.shows */
var byDeep = shows.slice().sort(function(a,b){return (b.deep_total||0)-(a.deep_total||0);});
var leadDeep = byDeep[0]||null;

var withFunnel = shows.filter(function(s){return s.funnel;});
var byConv = withFunnel.slice().sort(function(a,b){return (b.funnel.i2c_pct||0)-(a.funnel.i2c_pct||0);});
var leadConv = byConv[0]||null;

var withYt = shows.filter(function(s){return s.yt && s.yt.avg_pct!=null;});
var byYt = withYt.slice().sort(function(a,b){return (b.yt.avg_pct||0)-(a.yt.avg_pct||0);});
var leadYt = byYt[0]||null;

/* aggregate funnel across all shows */
var aggF = withFunnel.reduce(function(a,s){
  return {reached:a.reached+(s.funnel.reached||0),interested:a.interested+(s.funnel.interested||0),consumed:a.consumed+(s.funnel.consumed||0)};
},{reached:0,interested:0,consumed:0});

/* aggregate trend (sum of per-show daily) */
var trendMap={};
shows.forEach(function(s){ (s.trend||[]).forEach(function(p){ trendMap[p.d]=(trendMap[p.d]||0)+(p.v||0); }); });
var trendKeys=Object.keys(trendMap).sort();
var trendSeries=trendKeys.map(function(k){return trendMap[k];});

/* aggregate age + gender across shows */
var AGE_ORDER=['0-17','18-22','23-27','28-34','35-44','45-59','60+','60-150'];
function ageRank(b){ var i=AGE_ORDER.indexOf(b); return i<0?99:i; }
var ageMap={};
shows.forEach(function(s){ (s.age||[]).forEach(function(a){
  var br=a.displayName||a.ageBracket; if(!br||br==='Unknown'||br==='0-17') return;
  var c=(a.genderBreakdown&&a.genderBreakdown.counts)||[];
  function g(k){ var f=c.filter(function(x){return x.gender===k;})[0]; return f?f.count:0; }
  if(!ageMap[br]) ageMap[br]={m:0,f:0,nb:0};
  ageMap[br].m+=g('MALE'); ageMap[br].f+=g('FEMALE'); ageMap[br].nb+=g('NON_BINARY')+g('NOT_SPECIFIED');
}); });
var ageRows=Object.keys(ageMap).map(function(br){
  var r=ageMap[br]; return {br:br,m:r.m,f:r.f,nb:r.nb,n:r.m+r.f+r.nb};
}).filter(function(r){return r.n>0;}).sort(function(a,b){return ageRank(a.br)-ageRank(b.br);});
var ageGenderTotals=ageRows.reduce(function(a,r){return {m:a.m+r.m,f:a.f+r.f,nb:a.nb+r.nb};},{m:0,f:0,nb:0});

/* deep-listen leaderboard sorted */
var lead = shows.slice().sort(function(a,b){return (b.deep_total||0)-(a.deep_total||0);});

/* ---------- reusable HTML fragments ---------- */
function svgIco(path){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'; }
var IC = {
  headphones:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2.5" y="14" width="4.5" height="7" rx="2"/><rect x="17" y="14" width="4.5" height="7" rx="2"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0Z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/>',
  trend:'<path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h6v6"/>',

/* deep-listen leaderboard TABLE (compact, tabular-nums, tiny retain bar) */
function leaderboardTable(opts){
  opts=opts||{};
  var maxDeep=Math.max.apply(null,lead.map(function(s){return s.deep_total||0;}).concat([1]));
  var maxRet=Math.max.apply(null,lead.map(function(s){return (s.yt&&s.yt.avg_pct)||0;}).concat([1]));
  var h='<div class="scroll"><table><thead><tr>'+
    '<th>תוכנית</th><th>פרקים</th><th>סך האזנה</th><th>YT</th><th>Spotify</th><th>Apple</th><th>צופים ייח׳</th><th>שימור YT</th>'+
    '</tr></thead><tbody>';
  lead.forEach(function(s){
    var p=s.platforms||{};
    var ret=(s.yt&&s.yt.avg_pct!=null)? s.yt.avg_pct : null;
    var eps=publishedEps(s);
    h+='<tr>'+
      '<td class="nm">'+esc(s.name)+'</td>'+
      '<td class="num eps"><b>'+eps+'</b><span class="epd">/'+EPISODES_PLANNED+'</span></td>'+
      '<td class="cell tot"><span class="cellbar" style="background:'+COL.deep+';width:'+pct(s.deep_total,maxDeep)+'%"></span><span class="cellv num">'+nf(s.deep_total)+'</span></td>'+
      '<td class="num">'+nf(p.youtube)+'</td>'+
      '<td class="num">'+nf(p.spotify)+'</td>'+
      '<td class="num">'+nf(p.apple)+'</td>'+
      '<td class="num">'+nf(s.yt&&s.yt.unique_viewers)+'</td>'+
      '<td>'+(ret!=null? '<span class="miniretain"><span class="rb"><span style="width:'+pct(ret,maxRet)+'%"></span></span><span class="num">'+ret+'%</span></span>' : '<span class="num">–</span>')+'</td>'+
    '</tr>';
  });
  return h+'</tbody></table></div>';
}

/* ===================================================================
   ApexCharts — small, crisp, RTL-aware, guarded
   =================================================================== */
function hasApex(){ return (typeof window!=='undefined') && typeof window.ApexCharts==='function'; }
var rmotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function fallbackSpark(elId){
  var box=$(elId); if(!box) return;
  // pure-SVG sparkline so it degrades gracefully if ApexCharts CDN is missing
  var n=trendSeries.length;
  if(!n){ box.innerHTML='<div class="chartfallback">אין נתוני מגמה</div>'; return; }
  var W=640,H=48,max=Math.max.apply(null,trendSeries.concat([1]));
  var X=function(i){return 4+(n>1? i*(W-8)/(n-1):0);};
  var Y=function(v){return 4+(1-v/max)*(H-8);};
  var ln=trendSeries.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
  var ar='M'+X(0).toFixed(1)+' '+(H-4)+' '+ln.slice(1)+' L'+X(n-1).toFixed(1)+' '+(H-4)+' Z';
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:48px;overflow:visible">'+
    '<path d="'+ar+'" fill="'+COL.reach+'" opacity=".1"/>'+
    '<path d="'+ln+'" fill="none" stroke="'+COL.reach+'" stroke-width="2"/></svg>';
}

function drawSpark(elId){
  var box=$(elId); if(!box) return;
  if(!hasApex() || !trendSeries.length){ fallbackSpark(elId); return; }
  try{
    var opt={
      chart:{type:'area',height:60,sparkline:{enabled:true},animations:{enabled:!rmotion},fontFamily:'Heebo'},
      series:[{name:'האזנות',data:trendSeries}],
      stroke:{curve:'smooth',width:2},
      fill:{type:'gradient',gradient:{opacityFrom:.32,opacityTo:0}},
      colors:[COL.reach],
      tooltip:{enabled:true,x:{show:false},theme:'dark',y:{formatter:function(v){return nf(v)+' האזנות';}}}
    };
    new window.ApexCharts(box,opt).render();
  }catch(e){ fallbackSpark(elId); }
}

      '</div><div class="ws" style="margin-top:6px">שני מדדים נפרדים — לא מסכמים.</div>';

  }
  try{

      legend:{position:'bottom',fontSize:'11px',labels:{colors:'#9aa2b2'},markers:{width:9,height:9}},
      dataLabels:{enabled:true,formatter:function(val){return Math.round(val)+'%';},style:{fontSize:'11px',fontFamily:'Heebo'}},
      plotOptions:{pie:{donut:{size:'62%',labels:{show:true,total:{show:true,label:'סה״כ נקודות-מגע',fontSize:'10px',color:'#6b7488',formatter:function(){return kf(totDeep+totReach);}}}}}},
      tooltip:{theme:'dark',y:{formatter:function(v){return nf(v);}}}
    };
    new window.ApexCharts(box,opt).render();
  }catch(e){
    box.innerHTML='<div class="chartfallback">האזנה '+nf(totDeep)+' · סושיאל '+nf(totReach)+'</div>';
  }
}

/* ---------- mount variants ---------- */
function safe(fn,elId){
  try{ return fn(); }
  catch(e){
    if(window.console) console.error('build error in '+elId, e);
    return '<div class="block"><div class="bh"><h3>שגיאה בהצגת הוריאנט</h3></div><div class="sub">'+esc(e&&e.message||e)+'</div></div>';
  }
}
var built={A:false,B:false,C:false};
function renderVariant(key){
  if(built[key]) return;
  if(key==='A'){ $('vA').innerHTML=safe(buildA,'A'); drawSpark('spark-A'); }
  if(key==='B'){ $('vB').innerHTML=safe(buildB,'B'); drawSpark('spark-B'); drawDonutB(); }
  if(key==='C'){ $('vC').innerHTML=safe(buildC,'C'); drawSpark('spark-C'); }
  built[key]=true;
}

/* ---------- pills toggle ---------- */
var PILLS=[
  {k:'A',main:'א · כרטיסים',vk:'Stat-first'},
  {k:'B',main:'ב · צפוף',vk:'Dense BI'},
  {k:'C',main:'ג · נקי',vk:'Editorial'}
];
function selectVariant(key){
  PILLS.forEach(function(p){
    var pillEl=$('pill-'+p.k), vEl=$('v'+p.k);
    if(pillEl) pillEl.setAttribute('aria-selected', p.k===key?'true':'false');
    if(vEl) vEl.classList.toggle('on', p.k===key);
  });
  renderVariant(key);
  // ApexCharts inside a display:none container size to 0 — redraw on first reveal handled by render(); already rendered ones are fine.
  window.scrollTo({top:0,behavior:rmotion?'auto':'smooth'});
}
(function buildPills(){
  var wrap=$('pills'); if(!wrap) return;
  PILLS.forEach(function(p,i){
    var b=document.createElement('button');
    b.className='pill'; b.id='pill-'+p.k; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', i===0?'true':'false');
    b.innerHTML=esc(p.main)+'<span class="vk">'+esc(p.vk)+'</span>';
    b.onclick=function(){ selectVariant(p.k); };
    wrap.appendChild(b);
  });
})();

/* ---------- edit mode ---------- */
(function(){
  var t=$('editToggle'); if(!t) return;
  t.onclick=function(){ document.body.classList.toggle('editmode'); this.classList.toggle('on'); };
})();

/* ---------- init: render A now; if ApexCharts loads after (defer), re-draw A's spark ---------- */
renderVariant('A');
window.addEventListener('load', function(){
  // ApexCharts (defer) is ready now — replace any SVG fallback in the visible/already-built variant A spark with the nicer Apex version
  if(hasApex()){
    var box=$('spark-A');
    if(box){ box.innerHTML=''; drawSpark('spark-A'); }
  }
});

})();
</script>
