<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE/MAX × WeDo — דשבורד (גרסה ג)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --d-fast:250ms; --ease:cubic-bezier(.22,1,.36,1);
  --bg:#080a0e; --card:#151a25; --card2:#1b2230; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.17);
  --tx:#f1f3f8; --mut:#9aa2b2; --mut2:#6b7488;
  --reach:#2dd4bf; --deep:#fb923c;
  --ig:#ec5e9c; --fb:#4d8df5; --yt:#ff6a5a; --sp:#39d077; --ap:#a87bf0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";font-size:15px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
/* version switcher */
.vsw{display:flex;gap:6px;justify-content:center;padding:12px 0 4px}
.vsw a{font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:none;padding:6px 13px;border:1px solid var(--bd);border-radius:20px;transition:all var(--d-fast)}
.vsw a.on{background:var(--card2);color:var(--tx);border-color:var(--bd2)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0 12px}
.brand{font-weight:900;font-size:18px}.brand .s{color:var(--mut2);font-weight:300;margin:0 6px}.brand .r{color:var(--reach)}
.hmeta{font-size:12px;color:var(--mut)}
.tabwrap{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 72%,transparent);padding:6px 0 12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 15px;border:none;background:none;color:var(--mut);font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background var(--d-fast),color var(--d-fast)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.panel{display:none}.panel.on{display:block;animation:fade var(--d-fast) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:14px}
.kpi .l{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:25px;font-weight:900;letter-spacing:-.5px;margin-top:4px}
.kpi .v.reach{color:var(--reach)}.kpi .v.deep{color:var(--deep)}
.kpi .s{font-size:11.5px;color:var(--mut2);margin-top:2px}
.block{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.block.reach{border-top:3px solid var(--reach)}.block.deep{border-top:3px solid var(--deep)}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.bh h3{font-size:16px;font-weight:800}
.btag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.btag.r{background:rgba(54,214,198,.14);color:var(--reach)}.btag.d{background:rgba(243,162,62,.14);color:var(--deep)}
.block>.sub{font-size:12.5px;color:var(--mut);margin-bottom:13px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;color:var(--mut);font-weight:600;text-align:right;padding:0 10px 9px;white-space:nowrap}
td{padding:10px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap}
.cell{position:relative}.cellbar{position:absolute;inset:0;border-radius:6px;opacity:.15;z-index:0}.cellv{position:relative;z-index:1;font-weight:600}
td.tot{font-weight:800}
.tag-sm{font-size:10.5px;color:var(--mut2);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin-right:6px}
/* social by page */
.pg{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.pg:first-child{border-top:none}
.pg .nm{font-weight:600}.pg .meta{font-size:11.5px;color:var(--mut2);margin-top:1px}
.pg .vv{font-size:17px;font-weight:800;text-align:left;white-space:nowrap}
.pg .bar{grid-column:1/-1;height:7px;background:var(--bg);border-radius:5px;overflow:hidden}
.pg .bar>span{display:block;height:100%;border-radius:5px}
/* trend */
.trend-tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:3px}
.seg button{border:none;background:none;color:var(--mut);font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.chart{position:relative;height:170px;margin-top:6px}
.chart svg{width:100%;height:100%;overflow:visible}
.gl{stroke:rgba(255,255,255,.06);stroke-width:1}
.glt{fill:var(--mut2);font-size:10px}
.xlab{fill:var(--mut2);font-size:10px}
.demo .dl{display:grid;grid-template-columns:74px 1fr 44px;gap:8px;align-items:center;font-size:13px;color:var(--mut);padding:3px 0}
.demo .db{height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.demo .db>span{display:block;height:100%;background:linear-gradient(90deg,var(--fb),var(--reach));border-radius:5px}
.demo .dl .num{color:var(--tx);font-weight:600;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 13px}
.mc .l{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px}.mc .n{font-size:19px;font-weight:800;margin-top:3px}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;margin-bottom:7px}
.post .pl{font-size:13px;font-weight:500}.post .pmeta{font-size:11.5px;color:var(--mut);margin-top:2px}.post .pv{font-size:16px;font-weight:800}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1d2433;border:1px solid var(--bd2);padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:all var(--d-fast) var(--ease);z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){.kpis{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}table{font-size:13px}td,th{padding-left:6px;padding-right:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="vsw"><a href="index.html">גרסה א · מנהל</a><a href="v2.html">גרסה ב · כרטיסים</a><a class="on" href="v3.html">גרסה ג · מגמות</a></div>
  <header><div class="brand">wedo<span class="s">|</span><span class="r">RE/MAX</span></div><div class="hmeta"><span id="org"></span> · <span id="range"></span></div></header>
  <div class="tabwrap"><div class="tabs" id="tabs"></div></div>
  <div id="panels"></div>
  <div class="foot"><span id="sources"></span><span>wedo | RE/MAX</span></div>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const D=window.DASHBOARD_DATA,nf=n=>(n==null?'–':n.toLocaleString('en-US')),$=id=>document.getElementById(id),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const COL={ig:'#ec5e9c',fb:'#4d8df5',yt:'#ff6a5a',sp:'#39d077',ap:'#a87bf0',reach:'#36d6c6',deep:'#f3a23e'};
const o=D.overview,shows=D.shows,social=D.social;
const L=s=>s.youtube_views+s.spotify_streams+s.apple_plays;
$('org').textContent='אורגני · אפס ממומן';$('range').textContent=D.meta.range;$('sources').textContent=D.meta.sources.join(' · ');

const tabsEl=$('tabs'),panelsEl=$('panels');
[{id:'all',name:'סקירת הכל'}].concat(shows.map(s=>({name:s.name}))).forEach((t,i)=>{
  const b=el('button','tab',t.name);b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=()=>sel(i);tabsEl.appendChild(b);
  const p=el('div','panel'+(i===0?' on':''));p.id='p'+i;p.innerHTML=i===0?overviewHTML():showHTML(shows[i-1],i-1);panelsEl.appendChild(p);
});
function sel(i){[...tabsEl.children].forEach((t,j)=>t.setAttribute('aria-selected',i===j?'true':'false'));
  [...panelsEl.children].forEach((p,j)=>p.classList.toggle('on',i===j));window.scrollTo({top:0,behavior:'smooth'});
  if(i===0)drawTrend('ch-all',aggSeries,aggKeys);else{const s=shows[i-1];drawTrend('ch-'+(i-1),(s.trend||[]).map(p=>p.v||0),(s.trend||[]).map(p=>p.d));}}

/* ===== OVERVIEW ===== */
function overviewHTML(){
  const totL=shows.reduce((a,s)=>a+L(s),0);
  return `
  <div class="kpis">
    <div class="kpi"><div class="l"><span class="dot" style="background:${COL.reach}"></span>חשיפה בסושיאל</div><div class="v reach num">${nf(social.total_views)}</div><div class="s">צפיות רילס · ${social.page_count} עמודים</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:${COL.deep}"></span>האזנה לפרקים</div><div class="v deep num">${nf(totL)}</div><div class="s">YouTube + Spotify + Apple</div></div>
    <div class="kpi"><div class="l">תוכניות</div><div class="v num">${shows.length}</div><div class="s">המבוגר · אוויר פסגות · הפיצוח · סוגרים</div></div>
  </div>

  <div class="block deep">
    <div class="bh"><span class="btag d">האזנה</span><h3>האזנה לפרקים · לפי תוכנית</h3></div>
    <div class="sub">צפיות/האזנות לפרק מלא. כאן הקרדיט הוא של התוכנית עצמה.</div>
    <div style="overflow-x:auto"><table id="lead"></table></div>
  </div>

  <div class="block reach">
    <div class="bh"><span class="btag r">חשיפה</span><h3>חשיפה בסושיאל · לפי עמוד</h3></div>
    <div class="sub">החשיפה שייכת ל<b>עמוד שבו עלה הפוסט</b> — לא לתוכנית. רוב החשיפה הגדולה מגיעה מעמודי-המותג (מאני, רימקס), לא מעמודי המגישים.</div>
    <div id="pages"></div>
  </div>

  <div class="block">
    <div class="trend-tools"><div class="bh"><h3>מגמת חשיפה לאורך זמן</h3></div>
      <div class="seg" id="trseg"><button class="on" data-d="30">30 יום</button><button data-d="14">14 יום</button><button data-d="7">7 יום</button></div></div>
    <div class="sub">סך הזרמות יומיות, כל 4 התוכניות (Spotify) · המספרים על הציר</div>
    <div class="chart"><svg id="ch-all" viewBox="0 0 640 170" preserveAspectRatio="none"></svg></div>
  </div>

  <div class="two">
    <div class="block"><h3>מאיפה מאזינים · כל התוכניות</h3><div class="sub">Spotify · אחוז לפי מדינה</div><div class="demo" id="geo-all"></div></div>
    <div class="block"><h3>גיל הקהל · כל התוכניות</h3><div class="sub">Spotify · מספר מאזינים לפי גיל</div><div class="demo" id="age-all"></div></div>
  </div>

  <div class="toolbar">
    <button class="btn" onclick="copyT()"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>העתק</button>
    <button class="btn" onclick="csvT()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>CSV</button>
  </div>`;
}
function renderLead(){
  const mx={yt:Math.max(...shows.map(s=>s.youtube_views)),sp:Math.max(...shows.map(s=>s.spotify_streams)),ap:Math.max(...shows.map(s=>s.apple_plays))};
  const sorted=[...shows].sort((a,b)=>L(b)-L(a));
  const c=(v,m,col)=>`<td class="cell"><span class="cellbar" style="background:${col};width:${m?Math.round(100*v/m):0}%"></span><span class="cellv num">${nf(v)}</span></td>`;
  let h=`<thead><tr><th>תוכנית</th><th>YouTube</th><th>Spotify</th><th>Apple</th><th>סך האזנה</th><th>שימור</th></tr></thead><tbody>`;
  sorted.forEach(s=>{h+=`<tr><td class="nm">${s.name}</td>`+c(s.youtube_views,mx.yt,COL.yt)+c(s.spotify_streams,mx.sp,COL.sp)+c(s.apple_plays,mx.ap,COL.ap)+`<td class="tot num">${nf(L(s))}</td><td class="num">${s.youtube_retention_pct??'–'}%</td></tr>`;});
  $('lead').innerHTML=h+'</tbody>';
}
function renderPages(){
  const mx=Math.max(...social.by_page.map(p=>p.views))||1;
  $('pages').innerHTML=social.by_page.map(p=>{
    const shows_in=[...new Set(p.items.map(i=>i.show).filter(Boolean))].join(', ');
    const col=p.platform==='Instagram'?COL.ig:COL.fb;
    return `<div class="pg"><div><span class="nm">${p.page}</span><span class="tag-sm">${p.type}</span><div class="meta">${p.posts} פוסט${p.posts>1?'ים':''}${shows_in?' · '+shows_in:''}</div></div><div class="vv num">${nf(p.views)}</div><div class="bar"><span style="width:${Math.round(100*p.views/mx)}%;background:${col}"></span></div></div>`;}).join('');
}
/* trend with axes + numbers */
const aggMap={};shows.forEach(s=>(s.trend||[]).forEach(p=>{aggMap[p.d]=(aggMap[p.d]||0)+(p.v||0)}));
const aggKeys=Object.keys(aggMap).sort(),aggSeries=aggKeys.map(k=>aggMap[k]);
function drawTrend(id,series,keys,days){
  const svg=$(id);if(!svg)return;
  if(days){series=series.slice(-days);keys=keys.slice(-days);}
  const W=640,H=170,pl=44,pb=22,pt=10,n=series.length;
  if(!n){svg.innerHTML='<text x="320" y="85" fill="#6b7488" font-size="13" text-anchor="middle">אין נתוני מגמה</text>';return;}
  const max=Math.max(...series,1),niceMax=Math.ceil(max/5)*5||5;
  const X=i=>pl+(n>1?i*(W-pl-8)/(n-1):0),Y=v=>pt+(1-v/niceMax)*(H-pt-pb);
  let g='';for(let k=0;k<=2;k++){const v=niceMax*k/2,y=Y(v);g+=`<line class="gl" x1="${pl}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}"/><text class="glt" x="${pl-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${nf(Math.round(v))}</text>`;}
  const pts=series.map((v,i)=>[X(i),Y(v)]);
  const ln=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const ar=`M${pl} ${H-pb} `+ln.replace('M','L')+` L${X(n-1)} ${H-pb} Z`;
  const lp=pts[pts.length-1],mxi=series.indexOf(Math.max(...series)),mp=pts[mxi];
  let xl='';[0,Math.floor((n-1)/2),n-1].forEach(i=>{if(keys[i])xl+=`<text class="xlab" x="${X(i)}" y="${H-6}" text-anchor="middle">${keys[i].slice(5)}</text>`;});
  svg.innerHTML=g+`<path d="${ar}" fill="${COL.reach}" opacity=".12"/><path d="${ln}" fill="none" stroke="${COL.reach}" stroke-width="2.4"/>`+
    `<circle cx="${mp[0]}" cy="${mp[1]}" r="3.5" fill="${COL.reach}"/><text x="${mp[0]}" y="${(mp[1]-8).toFixed(1)}" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">${nf(series[mxi])}</text>`+
    `<circle cx="${lp[0]}" cy="${lp[1]}" r="3" fill="${COL.reach}"/>`+xl;
}
function renderDemoAll(){
  const geo={},age={};shows.forEach(s=>{(s.spotify_geo||[]).forEach(g=>{geo[g.displayName]=(geo[g.displayName]||0)+(g.value||0)});
    (s.spotify_age||[]).forEach(a=>{const n=(a.genderBreakdown?.counts||[]).reduce((x,c)=>x+(c.count||0),0);age[a.ageBracket]=(age[a.ageBracket]||0)+n});});
  const gE=Object.entries(geo).sort((a,b)=>b[1]-a[1]).slice(0,5),gS=gE.reduce((a,e)=>a+e[1],0)||1,gM=gE.length?gE[0][1]:1;
  $('geo-all').innerHTML=gE.map(([k,v])=>`<div class="dl"><span>${k}</span><div class="db"><span style="width:${Math.round(100*v/gM)}%"></span></div><span class="num">${Math.round(100*v/gS)}%</span></div>`).join('')||'<div class="sub">אין נתונים</div>';
  const ord=['18-22','23-27','28-34','35-44','45-59','60-150'],aE=Object.entries(age).filter(e=>e[1]>0).sort((a,b)=>ord.indexOf(a[0])-ord.indexOf(b[0])),aM=Math.max(1,...aE.map(e=>e[1]));
  $('age-all').innerHTML=aE.map(([k,v])=>`<div class="dl"><span>${k}</span><div class="db"><span style="width:${Math.round(100*v/aM)}%"></span></div><span class="num">${v}</span></div>`).join('')||'<div class="sub">אין נתונים</div>';
}

/* ===== PER-SHOW ===== */
function showHTML(s,idx){
  const geo=(s.spotify_geo||[]).slice(0,4).map(g=>`<div class="dl"><span>${g.displayName}</span><div class="db"><span style="width:${Math.round(g.value*100)}%"></span></div><span class="num">${Math.round(g.value*100)}%</span></div>`).join('')||'<div class="sub">אין נתונים</div>';
  const ages=(s.spotify_age||[]).map(a=>({br:a.ageBracket,n:(a.genderBreakdown?.counts||[]).reduce((x,c)=>x+(c.count||0),0)})).filter(a=>a.n>0),mA=Math.max(1,...ages.map(a=>a.n));
  const ageH=ages.map(a=>`<div class="dl"><span>${a.br}</span><div class="db"><span style="width:${Math.round(100*a.n/mA)}%"></span></div><span class="num">${a.n}</span></div>`).join('')||'<div class="sub">מדגם קטן</div>';
  const eps=(s.episodes||[]).map((e,i)=>`<tr><td>${i+1}. ${e.title.replace(/^פרק \\d+ - /,'').slice(0,44)}</td><td class="num" style="text-align:left;font-weight:700">${nf(e.plays)}</td></tr>`).join('')||'<tr><td colspan="2" class="sub">אין נתונים</td></tr>';
  const social_posts=(s.social_posts||[]).slice(0,5).map(p=>{
    const inner=`<div><div class="pl">${p.label}</div><div class="pmeta">עלה ב: ${p.account} · ${p.platform} · ❤ ${nf(p.likes)} · ↗ ${nf(p.shares)}</div></div><div class="pv num" style="color:${p.platform==='Instagram'?COL.ig:COL.fb}">${nf(p.views)}</div>`;
    return p.url?`<a class="post" href="${p.url}" target="_blank">${inner}</a>`:`<div class="post">${inner}</div>`;}).join('')||'<div class="sub">אין רילס שזוהו</div>';
  return `
  <div class="block deep"><div class="bh"><span class="btag d">האזנה</span><h3>${s.name} · האזנה לפרקים</h3></div>
    <div class="mgrid">
      <div class="mc"><div class="l"><span class="dot" style="background:${COL.yt}"></span>YouTube</div><div class="n num">${nf(s.youtube_views)}</div></div>
      <div class="mc"><div class="l"><span class="dot" style="background:${COL.sp}"></span>Spotify</div><div class="n num">${nf(s.spotify_streams)}</div></div>
      <div class="mc"><div class="l"><span class="dot" style="background:${COL.ap}"></span>Apple</div><div class="n num">${nf(s.apple_plays)}</div></div>
      <div class="mc"><div class="l">סך האזנה</div><div class="n num">${nf(L(s))}</div></div>
      <div class="mc"><div class="l">שימור YouTube</div><div class="n num">${s.youtube_retention_pct??'–'}%</div></div>
    </div>
    <div class="chart" style="height:150px"><svg id="ch-${idx}" viewBox="0 0 640 150" preserveAspectRatio="none"></svg></div>
    <div class="sub" style="margin-top:4px">מגמת הזרמות יומית · 30 יום (Spotify)</div>
  </div>
  <div class="two">
    <div class="block"><h3>ביצועים לפי פרק</h3><div class="sub">Spotify · מספר הזרמות</div><table><tbody>${eps}</tbody></table></div>
    <div class="block reach"><div class="bh"><span class="btag r">חשיפה</span><h3>רילס שעלו על התוכנית</h3></div><div class="sub">בעמודים שונים — החשיפה היא של העמוד שבו עלה הפוסט</div>${social_posts}</div>
  </div>
  <div class="two">
    <div class="block"><h3>מאיפה מאזינים</h3><div class="sub">Spotify · מדגם קטן</div><div class="demo">${geo}</div></div>
    <div class="block"><h3>גיל הקהל</h3><div class="sub">Spotify · מאזינים לפי גיל</div><div class="demo">${ageH}</div></div>
  </div>`;
}
function tRows(){let r=[['תוכנית','YouTube','Spotify','Apple','סך האזנה','שימור%']];shows.forEach(s=>r.push([s.name,s.youtube_views,s.spotify_streams,s.apple_plays,L(s),s.youtube_retention_pct]));
  r.push([],['עמוד סושיאל','פלטפורמה','סוג','פוסטים','חשיפה']);social.by_page.forEach(p=>r.push([p.page,p.platform,p.type,p.posts,p.views]));return r;}
function copyT(){navigator.clipboard.writeText(tRows().map(r=>r.join('\t')).join('\n')).then(()=>toast('הועתק'));}
function csvT(){const c='﻿'+tRows().map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='remax.csv';a.click();}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

renderLead();renderPages();renderDemoAll();drawTrend('ch-all',aggSeries,aggKeys);
$('trseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));drawTrend('ch-all',aggSeries,aggKeys,+b.dataset.d);});
</script>
